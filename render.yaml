services:
  - name: brixo-app
    type: web
    runtime: docker
    plan: free
    rootDir: .
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PYTHON_SERVICE_URL
        sync: false
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

  - name: brixo-python-service
    type: web
    runtime: docker
    plan: free
    rootDir: ./python-service
    dockerfilePath: ./Dockerfile
    dockerContext: .
