# Configuracion solo para los tests: base H2 en memoria, sin dependencias
# externas. Asi `mvnw test` corre sin necesidad de levantar PostgreSQL.
# Este archivo reemplaza al de src/main/resources durante las pruebas.
spring.datasource.url=jdbc:h2:mem:brixo_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=

# Igual que en produccion, el dialecto lo deduce Hibernate de la conexion.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.thymeleaf.cache=false
