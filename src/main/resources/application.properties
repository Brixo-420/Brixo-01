spring.datasource.url=jdbc:mysql://localhost:3307/brixo?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.thymeleaf.cache=false

spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1

python.service.url=${PYTHON_SERVICE_URL:http://localhost:8001}
file.upload.path=uploads/identidad

# Sesión: expira a los 30 minutos de inactividad
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict