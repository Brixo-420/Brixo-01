# ── Base de datos ─────────────────────────────────────────────
# PostgreSQL en local y en produccion: un solo motor, un solo comportamiento.
# En Render estos tres valores los sobreescriben las variables de entorno
# SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD (tienen prioridad sobre este archivo).
# En local apuntan al contenedor de docker-compose.yml (credenciales desechables).
spring.datasource.url=jdbc:postgresql://localhost:5432/brixo
spring.datasource.username=brixo
spring.datasource.password=brixo

# El dialecto NO se fija a proposito: Hibernate lo deduce de la conexion.
# Fijarlo a mano fue lo que dejo pasar sintaxis de MySQL hasta produccion.
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.thymeleaf.cache=false

spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1

python.service.url=${PYTHON_SERVICE_URL:http://localhost:8001}
file.upload.path=uploads/identidad

# Sesión: expira a los 30 minutos de inactividad
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
