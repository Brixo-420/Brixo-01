spring.application.name=Brixo
spring.profiles.default=local

# MySQL local
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:brixo}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false

# LLM (Cotizador IA) — configura via variables de entorno
# Proveedores soportados: groq | openai | anthropic
llm.provider=${LLM_PROVIDER:groq}
llm.api-key=${LLM_API_KEY:}
llm.model=${LLM_MODEL:}
