<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notificaciones | Brixo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <th:block th:replace="~{fragments/sidebar :: sidebarCss}"></th:block>
    <style>
        :root {
            --primary:#0ea5e9; --primary-d:#0284c7;
            --secondary:#6366f1;
            --success:#10b981;
            --danger:#ef4444;
            --border:#e2e8f0;
            --muted:#64748b;
            --text:#0f172a;
            --bg:#f8fafc;
        }

        /* ── Cabecera de sección ── */
        .notif-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: .8rem;
        }
        .notif-title {
            display: flex;
            align-items: center;
            gap: .6rem;
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--text);
        }
        .notif-count {
            background: var(--primary);
            color: #fff;
            border-radius: 20px;
            padding: .15rem .6rem;
            font-size: .72rem;
            font-weight: 700;
        }

        .btn-mark {
            background: #fff;
            border: 1.5px solid var(--border);
            border-radius: 9px;
            padding: .45rem 1rem;
            font: 700 .82rem "Plus Jakarta Sans", sans-serif;
            color: var(--muted);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            transition: all .2s;
        }
        .btn-mark:hover { border-color: var(--primary); color: var(--primary); }

        /* ── Lista ── */
        .notif-list { display: flex; flex-direction: column; gap: .55rem; }

        .notif-item {
            background: #fff;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 1rem 1.25rem;
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            text-decoration: none;
            color: inherit;
            transition: border-color .2s, box-shadow .2s, background .2s;
            position: relative;
        }
        .notif-item:hover {
            border-color: var(--primary);
            box-shadow: 0 4px 16px rgba(14,165,233,.1);
            background: #fafcff;
            color: inherit;
        }
        .notif-item.unread {
            border-left: 3px solid var(--primary);
            background: rgba(14,165,233,.025);
        }

        .notif-dot {
            position: absolute;
            top: 1rem;
            right: 1rem;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary);
        }

        .notif-icon-wrap {
            width: 42px;
            height: 42px;
            border-radius: 11px;
            background: linear-gradient(135deg, #e0f2fe, #ede9fe);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: var(--primary);
            font-size: .95rem;
        }
        .notif-item.unread .notif-icon-wrap {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
        }

        .notif-body { flex: 1; min-width: 0; }
        .notif-msg {
            font-size: .9rem;
            font-weight: 600;
            line-height: 1.45;
            color: var(--text);
        }
        .notif-item.unread .notif-msg { font-weight: 700; }
        .notif-date {
            font-size: .76rem;
            color: var(--muted);
            margin-top: .25rem;
            display: flex;
            align-items: center;
            gap: .3rem;
        }

        /* ── Empty state ── */
        .empty-wrap {
            background: #fff;
            border: 1.5px solid var(--border);
            border-radius: 16px;
            padding: 4rem 2rem;
            text-align: center;
        }
        .empty-icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.2rem;
            font-size: 1.8rem;
            color: #94a3b8;
        }
        .empty-wrap h3 { font-size: 1.05rem; font-weight: 700; color: var(--text); margin-bottom: .4rem; }
        .empty-wrap p  { font-size: .87rem; color: var(--muted); }
    </style>
</head>
<body>
<div class="dash-layout">
    <th:block th:replace="~{fragments/sidebar :: sidebar('notificaciones')}"></th:block>

    <div class="dash-content">
        <header class="dash-topbar">
            <h1 style="margin:0;font-size:1.15rem;font-weight:800">
                <i class="fas fa-bell" style="color:#0ea5e9;margin-right:.5rem"></i>
                Notificaciones
            </h1>
            <span sec:authentication="name" style="font-weight:600;color:#64748b;font-size:.88rem"></span>
        </header>

        <div class="dash-main" style="max-width:760px">

            <!-- Tira decorativa construcción -->
            <div style="display:flex;gap:.85rem;align-items:center;margin-bottom:1rem;opacity:.13;color:#0ea5e9;font-size:1.4rem;pointer-events:none" aria-hidden="true">
                <i class="fas fa-hard-hat"></i>
                <i class="fas fa-hammer"></i>
                <i class="fas fa-wrench"></i>
                <i class="fas fa-bolt"></i>
                <i class="fas fa-tools"></i>
                <i class="fas fa-paint-roller"></i>
                <i class="fas fa-faucet"></i>
                <i class="fas fa-cogs"></i>
            </div>

            <div class="notif-header">
                <div class="notif-title">
                    Centro de notificaciones
                    <span class="notif-count" th:if="${!#lists.isEmpty(notificaciones)}"
                          th:text="${#lists.size(notificaciones)}"></span>
                </div>
                <form th:if="${!#lists.isEmpty(notificaciones)}"
                      th:action="@{/notificaciones/marcar-todas}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn-mark">
                        <i class="fas fa-check-double"></i> Marcar todas como leídas
                    </button>
                </form>
            </div>

            <!-- Lista de notificaciones -->
            <div class="notif-list" th:if="${!#lists.isEmpty(notificaciones)}">
                <a th:each="n : ${notificaciones}"
                   th:href="${n.url != null ? n.url : '#'}"
                   class="notif-item"
                   th:classappend="${!n.leida} ? 'unread' : ''">
                    <div th:if="${!n.leida}" class="notif-dot"></div>
                    <div class="notif-icon-wrap">
                        <i class="fas fa-bell"></i>
                    </div>
                    <div class="notif-body">
                        <div class="notif-msg" th:text="${n.mensaje}"></div>
                        <div class="notif-date">
                            <i class="fas fa-clock" style="font-size:.68rem"></i>
                            <span th:text="${#temporals.format(n.fechaCreacion, 'dd MMM yyyy, HH:mm')}"></span>
                        </div>
                    </div>
                </a>
            </div>

            <!-- Sin notificaciones -->
            <div th:if="${#lists.isEmpty(notificaciones)}" class="empty-wrap">
                <div class="empty-icon"><i class="fas fa-bell-slash"></i></div>
                <h3>Sin notificaciones</h3>
                <p>Cuando recibas notificaciones aparecerán aquí.</p>
            </div>

        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
