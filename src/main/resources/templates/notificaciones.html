<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notificaciones | Brixo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/design-system.css}">
    <link rel="stylesheet" th:href="@{/css/brixo.css}">
    <style>
        :root {
            --primary: #0ea5e9;
            --primary-dark: #0284c7;
            --secondary: #6366f1;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; }
        html, body { margin:0; padding:0; font-family:"Plus Jakarta Sans",sans-serif; background:var(--bg); color:var(--text); }
        .page-wrap { max-width:800px; margin:0 auto; padding:90px 1.5rem 3rem; }

        .page-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; flex-wrap:wrap; gap:1rem; }
        .page-header h1 { font-size:1.6rem; font-weight:800; margin:0; display:flex; align-items:center; gap:.6rem; }
        .page-header h1 i { color:var(--primary); }

        .btn-bx { border:none; border-radius:10px; padding:.6rem 1.1rem; font-weight:700; cursor:pointer; text-decoration:none; font-size:.88rem; transition:all .25s; display:inline-flex; align-items:center; gap:.4rem; }
        .btn-bx:hover { transform:translateY(-2px); box-shadow:0 6px 16px rgba(0,0,0,.12); }
        .btn-bx-primary { background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff; }
        .btn-bx-outline { background:transparent; border:1.5px solid var(--border); color:var(--text); }
        .btn-bx-outline:hover { border-color:var(--primary); color:var(--primary); }

        .notif-list { display:flex; flex-direction:column; gap:.6rem; }
        .notif-item { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:1rem 1.2rem; display:flex; align-items:flex-start; gap:.8rem; transition:all .2s; text-decoration:none; color:inherit; }
        .notif-item:hover { border-color:var(--primary); box-shadow:0 2px 10px rgba(14,165,233,.08); }
        .notif-item.no-leida { border-left:3px solid var(--primary); background:rgba(14,165,233,.03); }
        .notif-icon { width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,rgba(14,165,233,.1),rgba(99,102,241,.1)); color:var(--primary); flex-shrink:0; }
        .notif-body { flex:1; }
        .notif-msg { font-size:.92rem; font-weight:600; line-height:1.4; }
        .notif-date { font-size:.78rem; color:var(--muted); margin-top:.2rem; }

        .empty-state { text-align:center; padding:3rem 1rem; color:var(--muted); }
        .empty-state i { font-size:3rem; margin-bottom:1rem; opacity:.4; }
        .empty-state p { font-size:1.05rem; font-weight:600; }
    </style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar(overlay=false)}"></div>

<div class="page-wrap">
    <div class="page-header">
        <h1><i class="fas fa-bell"></i> Notificaciones</h1>
        <form th:if="${!#lists.isEmpty(notificaciones)}" th:action="@{/notificaciones/marcar-todas}" method="post">
            <button type="submit" class="btn-bx btn-bx-outline"><i class="fas fa-check-double"></i> Marcar todas como leídas</button>
        </form>
    </div>

    <div class="notif-list" th:if="${!#lists.isEmpty(notificaciones)}">
        <a th:each="n : ${notificaciones}"
           th:href="${n.url != null ? n.url : '#'}"
           class="notif-item"
           th:classappend="${!n.leida} ? 'no-leida' : ''">
            <div class="notif-icon"><i class="fas fa-bell"></i></div>
            <div class="notif-body">
                <div class="notif-msg" th:text="${n.mensaje}"></div>
                <div class="notif-date" th:text="${#temporals.format(n.fechaCreacion, 'dd/MM/yyyy HH:mm')}"></div>
            </div>
        </a>
    </div>

    <div th:if="${#lists.isEmpty(notificaciones)}" class="empty-state">
        <i class="fas fa-bell-slash"></i>
        <p>No tienes notificaciones</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div th:replace="~{fragments/navbar :: navbarJs}"></div>
</body>
</html>
