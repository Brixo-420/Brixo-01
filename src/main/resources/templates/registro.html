<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear cuenta | Brixo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f1f5f9;
            --card: #ffffff;
            --ink: #0f172a;
            --muted: #64748b;
            --accent: #0ea5e9;
            --danger: #ef4444;
            --ok: #16a34a;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Manrope", sans-serif;
            background: radial-gradient(circle at 15% 20%, #dbeafe 0%, #f1f5f9 48%, #e2e8f0 100%);
            display: grid;
            place-items: center;
            color: var(--ink);
            padding: 1rem;
        }

        .card {
            width: 100%;
            max-width: 430px;
            background: var(--card);
            border-radius: 16px;
            border: 1px solid #dbe2ea;
            box-shadow: 0 20px 45px rgba(15, 23, 42, .10);
            padding: 1.3rem;
        }

        .brand {
            margin: 0 0 .4rem;
            font-size: 1.9rem;
            font-weight: 800;
            color: #0284c7;
            text-align: center;
            letter-spacing: .5px;
        }

        .subtitle {
            text-align: center;
            color: var(--muted);
            margin: 0 0 1.2rem;
            font-size: .95rem;
        }

        .field { margin-bottom: .85rem; }

        label {
            display: block;
            margin-bottom: .3rem;
            font-size: .9rem;
            font-weight: 700;
        }

        input {
            width: 100%;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: .72rem .78rem;
            font: inherit;
        }

        input:focus {
            outline: 2px solid rgba(14, 165, 233, .25);
            border-color: #38bdf8;
        }

        .btn {
            width: 100%;
            border: none;
            border-radius: 10px;
            background: var(--accent);
            color: #fff;
            font-weight: 800;
            padding: .75rem .9rem;
            cursor: pointer;
            font-size: 1rem;
        }

        .btn:hover {
            background: #0284c7;
        }

        .alert {
            border-radius: 10px;
            padding: .65rem .75rem;
            margin-bottom: .9rem;
            font-size: .9rem;
            font-weight: 600;
        }

        .alert-error {
            color: #fff;
            background: var(--danger);
        }

        .field-error {
            color: var(--danger);
            font-size: .82rem;
            margin-top: .2rem;
        }

        .login-link {
            text-align: center;
            margin-top: 1rem;
            font-size: .9rem;
            color: var(--muted);
        }

        .login-link a {
            color: var(--accent);
            font-weight: 700;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<section class="card">
    <h1 class="brand">BRIXO</h1>
    <p class="subtitle">Crea tu cuenta para empezar</p>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <form th:action="@{/registro}" th:object="${usuario}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div class="field">
            <label for="nombre">Nombre completo</label>
            <input id="nombre" th:field="*{nombre}" type="text" required placeholder="Tu nombre">
            <div th:if="${#fields.hasErrors('nombre')}" class="field-error" th:errors="*{nombre}"></div>
        </div>

        <div class="field">
            <label for="email">Correo electrónico</label>
            <input id="email" th:field="*{email}" type="email" required placeholder="correo@ejemplo.com">
            <div th:if="${#fields.hasErrors('email')}" class="field-error" th:errors="*{email}"></div>
        </div>

        <div class="field">
            <label for="password">Contraseña</label>
            <input id="password" th:field="*{password}" type="password" required placeholder="Mínimo 6 caracteres">
        </div>

        <button type="submit" class="btn">Crear cuenta</button>
    </form>

    <div class="login-link">
        ¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a>
    </div>
</section>
</body>
</html>
