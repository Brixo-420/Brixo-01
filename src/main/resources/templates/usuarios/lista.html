<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuarios | Brixo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/design-system.css}">
    <link rel="stylesheet" th:href="@{/css/brixo.css}">
    <style>
        :root {
            --primary: #0ea5e9;
            --primary-dark: #0284c7;
            --secondary: #6366f1;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; }
        html, body { margin:0; padding:0; font-family:"Plus Jakarta Sans",sans-serif; background:var(--bg); color:var(--text); }

        .page-wrap { max-width:1100px; margin:0 auto; padding:90px 1.5rem 3rem; }

        .page-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; flex-wrap:wrap; gap:1rem; }
        .page-header h1 { font-size:1.6rem; font-weight:800; margin:0; display:flex; align-items:center; gap:.6rem; }
        .page-header h1 i { color:var(--primary); }

        .btn-bx { border:none; border-radius:10px; padding:.6rem 1.1rem; font-weight:700; cursor:pointer; text-decoration:none; font-size:.88rem; transition:all .25s; display:inline-flex; align-items:center; gap:.4rem; }
        .btn-bx:hover { transform:translateY(-2px); box-shadow:0 6px 16px rgba(0,0,0,.12); }
        .btn-bx-primary { background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff; }
        .btn-bx-primary:hover { color:#fff; }
        .btn-bx-outline { background:transparent; border:1.5px solid var(--border); color:var(--text); }
        .btn-bx-outline:hover { border-color:var(--primary); color:var(--primary); }
        .btn-bx-danger { background:transparent; border:1.5px solid var(--danger); color:var(--danger); }
        .btn-bx-danger:hover { background:var(--danger); color:#fff; }
        .btn-bx-sm { padding:.4rem .7rem; font-size:.8rem; border-radius:8px; }

        .bx-alert { border-radius:10px; padding:.7rem 1rem; font-weight:600; font-size:.9rem; margin-bottom:1rem; display:flex; align-items:center; gap:.5rem; }
        .bx-alert-ok { background:rgba(16,185,129,.1); color:#047857; border:1px solid rgba(16,185,129,.2); }
        .bx-alert-err { background:rgba(239,68,68,.1); color:#b91c1c; border:1px solid rgba(239,68,68,.2); }

        /* Stats mini */
        .stats-mini { display:flex; gap:.8rem; margin-bottom:1.5rem; flex-wrap:wrap; }
        .stat-pill { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:.6rem 1rem; display:flex; align-items:center; gap:.5rem; font-size:.88rem; font-weight:600; box-shadow:0 2px 6px rgba(15,23,42,.04); }
        .stat-pill i { font-size:1rem; }
        .stat-pill .num { font-weight:800; font-size:1.05rem; }
        .stat-pill.admin i { color:var(--warning); }
        .stat-pill.cliente i { color:var(--primary); }
        .stat-pill.contratista i { color:var(--success); }

        /* Cards grid */
        .users-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:1rem; }

        .user-card { background:var(--card); border-radius:14px; border:1px solid var(--border); box-shadow:0 2px 10px rgba(15,23,42,.05); transition:all .3s; overflow:hidden; }
        .user-card:hover { box-shadow:0 8px 24px rgba(15,23,42,.1); transform:translateY(-3px); border-color:var(--primary); }

        .user-card-top { height:4px; }
        .user-card-top.admin { background:linear-gradient(90deg,var(--warning),#fbbf24); }
        .user-card-top.cliente { background:linear-gradient(90deg,var(--primary),var(--secondary)); }
        .user-card-top.contratista { background:linear-gradient(90deg,var(--success),#34d399); }
        .user-card-top.sin-rol { background:linear-gradient(90deg,#94a3b8,#cbd5e1); }

        .user-card-body { padding:1.2rem 1.4rem; }

        .user-header { display:flex; align-items:center; gap:.8rem; margin-bottom:.8rem; }
        .user-avatar { width:48px; height:48px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:1.1rem; color:#fff; flex-shrink:0; }
        .user-avatar.admin { background:linear-gradient(135deg,var(--warning),#f97316); }
        .user-avatar.cliente { background:linear-gradient(135deg,var(--primary),var(--secondary)); }
        .user-avatar.contratista { background:linear-gradient(135deg,var(--success),#34d399); }
        .user-avatar.sin-rol { background:#94a3b8; }
        .user-name { font-size:1.05rem; font-weight:700; line-height:1.2; }
        .user-id { font-size:.75rem; color:var(--muted); font-weight:600; }

        .user-meta { display:flex; flex-direction:column; gap:.35rem; margin-bottom:.8rem; }
        .user-meta-item { display:flex; align-items:center; gap:.4rem; font-size:.85rem; color:var(--muted); }
        .user-meta-item i { width:16px; text-align:center; font-size:.78rem; color:var(--primary); }
        .user-meta-item span { color:var(--text); font-weight:500; }

        .role-badge { display:inline-flex; align-items:center; gap:.3rem; padding:.25rem .65rem; border-radius:6px; font-size:.75rem; font-weight:700; text-transform:uppercase; letter-spacing:.3px; }
        .role-badge.admin { background:rgba(245,158,11,.12); color:#b45309; }
        .role-badge.cliente { background:rgba(14,165,233,.12); color:#0369a1; }
        .role-badge.contratista { background:rgba(16,185,129,.12); color:#047857; }
        .role-badge.sin-rol { background:rgba(148,163,184,.15); color:#475569; }

        .user-card-actions { display:flex; gap:.4rem; padding:.8rem 1.4rem; background:#fafbfc; border-top:1px solid var(--border); }

        .empty-state { text-align:center; padding:3rem 1rem; color:var(--muted); }
        .empty-state i { font-size:3rem; margin-bottom:1rem; opacity:.4; }
        .empty-state p { font-size:1.05rem; font-weight:600; }

        /* Search */
        .search-box { position:relative; max-width:320px; }
        .search-box input { border:1.5px solid var(--border); border-radius:10px; padding:.55rem .8rem .55rem 2.2rem; font:inherit; font-size:.9rem; width:100%; transition:border-color .2s; }
        .search-box input:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(14,165,233,.12); }
        .search-box i { position:absolute; left:.8rem; top:50%; transform:translateY(-50%); color:var(--muted); font-size:.85rem; }

        @media (max-width:700px) {
            .users-grid { grid-template-columns:1fr; }
            .page-header { flex-direction:column; align-items:flex-start; }
            .stats-mini { flex-direction:column; }
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar(overlay=false)}"></div>

<div class="page-wrap">

    <!-- HEADER -->
    <div class="page-header">
        <h1><i class="fas fa-users-cog"></i> Gestión de Usuarios</h1>
        <div style="display:flex;gap:.6rem;align-items:center;flex-wrap:wrap">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Buscar usuario..." oninput="filtrarUsuarios()">
            </div>
            <a th:href="@{/admin/usuarios/nuevo}" class="btn-bx btn-bx-primary">
                <i class="fas fa-plus"></i> Nuevo usuario
            </a>
        </div>
    </div>

    <!-- ALERTAS -->
    <div th:if="${ok}" class="bx-alert bx-alert-ok"><i class="fas fa-check-circle"></i> <span th:text="${ok}"></span></div>
    <div th:if="${error}" class="bx-alert bx-alert-err"><i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span></div>

    <!-- STATS -->
    <div class="stats-mini">
        <div class="stat-pill">
            <i class="fas fa-users"></i> Total: <span class="num" th:text="${#lists.size(usuarios)}"></span>
        </div>
        <div class="stat-pill admin">
            <i class="fas fa-shield-alt"></i> Admin: <span class="num" th:text="${#lists.size(usuarios.?[rol != null and rol.nombre == 'ADMIN'])}"></span>
        </div>
        <div class="stat-pill cliente">
            <i class="fas fa-user"></i> Clientes: <span class="num" th:text="${#lists.size(usuarios.?[rol != null and rol.nombre == 'CLIENTE'])}"></span>
        </div>
        <div class="stat-pill contratista">
            <i class="fas fa-hard-hat"></i> Contratistas: <span class="num" th:text="${#lists.size(usuarios.?[rol != null and rol.nombre == 'CONTRATISTA'])}"></span>
        </div>
    </div>

    <!-- USERS GRID -->
    <div class="users-grid" id="usersGrid" th:if="${!#lists.isEmpty(usuarios)}">
        <div class="user-card" th:each="u : ${usuarios}"
             th:data-name="${u.nombre}" th:data-email="${u.email}"
             th:data-rol="${u.rol != null ? u.rol.nombre : ''}">
            <div class="user-card-top"
                 th:classappend="${u.rol != null ? #strings.toLowerCase(u.rol.nombre) : 'sin-rol'}"></div>
            <div class="user-card-body">
                <div class="user-header">
                    <div class="user-avatar"
                         th:classappend="${u.rol != null ? #strings.toLowerCase(u.rol.nombre) : 'sin-rol'}">
                        <i class="fas" th:classappend="${u.rol != null and u.rol.nombre == 'ADMIN'} ? 'fa-shield-alt' : (${u.rol != null and u.rol.nombre == 'CONTRATISTA'} ? 'fa-hard-hat' : 'fa-user')"></i>
                    </div>
                    <div style="flex:1">
                        <div class="user-name" th:text="${u.nombre}"></div>
                        <div class="user-id" th:text="'#' + ${u.id}"></div>
                    </div>
                    <span class="role-badge"
                          th:classappend="${u.rol != null ? #strings.toLowerCase(u.rol.nombre) : 'sin-rol'}"
                          th:text="${u.rol != null ? u.rol.nombre : 'SIN ROL'}"></span>
                    <span th:if="${u.contratistaAprobado and (u.rol == null or u.rol.nombre != 'CONTRATISTA')}"
                          class="role-badge contratista" style="margin-left:.2rem" title="También Contratista">+CTR</span>
                    <span th:if="${u.contratistaAprobado and u.rol != null and u.rol.nombre == 'CONTRATISTA'}"
                          class="role-badge cliente" style="margin-left:.2rem" title="También Cliente">+CLI</span>
                </div>
                <div class="user-meta">
                    <div class="user-meta-item">
                        <i class="fas fa-envelope"></i>
                        <span th:text="${u.email}"></span>
                    </div>
                    <div class="user-meta-item" th:if="${u.telefono != null and !u.telefono.isEmpty()}">
                        <i class="fas fa-phone"></i>
                        <span th:text="${u.telefono}"></span>
                    </div>
                    <div class="user-meta-item" th:if="${u.ciudad != null and !u.ciudad.isEmpty()}">
                        <i class="fas fa-city"></i>
                        <span th:text="${u.ciudad}"></span>
                    </div>
                    <div class="user-meta-item" th:if="${u.direccion != null and !u.direccion.isEmpty()}">
                        <i class="fas fa-map-marker-alt"></i>
                        <span th:text="${u.direccion}"></span>
                    </div>
                </div>
            </div>
            <div class="user-card-actions">
                <a class="btn-bx btn-bx-outline btn-bx-sm" th:href="@{/admin/usuarios/{id}/editar(id=${u.id})}">
                    <i class="fas fa-edit"></i> Editar
                </a>
                <form th:action="@{/admin/usuarios/{id}/eliminar(id=${u.id})}" method="post" class="d-inline">
                    <button type="submit" class="btn-bx btn-bx-danger btn-bx-sm"
                            onclick="return confirm('¿Eliminar este usuario? Esta acción no se puede deshacer.')">
                        <i class="fas fa-trash"></i> Eliminar
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- EMPTY STATE -->
    <div th:if="${#lists.isEmpty(usuarios)}" class="empty-state">
        <i class="fas fa-users-slash"></i>
        <p>No hay usuarios registrados</p>
        <a th:href="@{/admin/usuarios/nuevo}" class="btn-bx btn-bx-primary" style="margin-top:.5rem">
            <i class="fas fa-plus"></i> Crear el primero
        </a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div th:replace="~{fragments/navbar :: navbarJs}"></div>
<script>
function filtrarUsuarios() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    document.querySelectorAll('.user-card').forEach(card => {
        const name = (card.dataset.name || '').toLowerCase();
        const email = (card.dataset.email || '').toLowerCase();
        const rol = (card.dataset.rol || '').toLowerCase();
        card.style.display = (name.includes(q) || email.includes(q) || rol.includes(q)) ? '' : 'none';
    });
}
</script>
</body>
</html>
