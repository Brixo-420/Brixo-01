<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestión de Usuarios | Brixo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <th:block th:replace="~{fragments/sidebar :: sidebarCss}"></th:block>
    <style>
        :root {
            --primary:#0ea5e9; --primary-dark:#0284c7;
            --secondary:#6366f1;
            --success:#10b981;
            --warning:#f59e0b;
            --danger:#ef4444;
            --border:#e2e8f0;
            --muted:#64748b;
        }

        /* ── Stat cards ── */
        .stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:1rem; margin-bottom:1.8rem; }
        .stat-card {
            background:#fff; border-radius:14px; border:1px solid var(--border);
            padding:1.1rem 1.3rem;
            display:flex; align-items:center; gap:.9rem;
            box-shadow:0 2px 8px rgba(15,23,42,.05);
        }
        .stat-icon {
            width:44px; height:44px; border-radius:11px;
            display:flex; align-items:center; justify-content:center;
            font-size:1.1rem; color:#fff; flex-shrink:0;
        }
        .stat-icon.total    { background:linear-gradient(135deg,#0ea5e9,#6366f1); }
        .stat-icon.admin    { background:linear-gradient(135deg,#f59e0b,#f97316); }
        .stat-icon.cliente  { background:linear-gradient(135deg,#0ea5e9,#0284c7); }
        .stat-icon.contr    { background:linear-gradient(135deg,#10b981,#059669); }
        .stat-label { font-size:.78rem; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.4px; }
        .stat-num   { font-size:1.6rem; font-weight:800; line-height:1; color:#0f172a; }

        /* ── Search & header ── */
        .toolbar { display:flex; align-items:center; gap:.8rem; margin-bottom:1.5rem; flex-wrap:wrap; }
        .search-wrap { position:relative; flex:1; min-width:200px; max-width:340px; }
        .search-wrap i { position:absolute; left:.8rem; top:50%; transform:translateY(-50%); color:var(--muted); font-size:.85rem; pointer-events:none; }
        .search-wrap input {
            width:100%; border:1.5px solid var(--border); border-radius:10px;
            padding:.55rem .85rem .55rem 2.2rem;
            font:600 .88rem "Plus Jakarta Sans",sans-serif;
            transition:border-color .2s, box-shadow .2s;
        }
        .search-wrap input:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(14,165,233,.12); }

        /* ── Filter pills ── */
        .filter-pills { display:flex; gap:.4rem; flex-wrap:wrap; margin-bottom:1.5rem; }
        .fpill {
            border:1.5px solid var(--border); background:#fff; border-radius:20px;
            padding:.3rem .85rem; font-size:.78rem; font-weight:700; cursor:pointer;
            transition:all .2s; color:var(--muted);
        }
        .fpill:hover, .fpill.active { background:var(--primary); border-color:var(--primary); color:#fff; }
        .fpill.admin.active  { background:#f59e0b; border-color:#f59e0b; color:#fff; }
        .fpill.cliente.active{ background:#0ea5e9; border-color:#0ea5e9; color:#fff; }
        .fpill.contr.active  { background:#10b981; border-color:#10b981; color:#fff; }

        /* ── User cards grid ── */
        .users-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:1rem; }

        .user-card {
            background:#fff; border-radius:16px; border:1.5px solid var(--border);
            box-shadow:0 2px 10px rgba(15,23,42,.05);
            transition:all .25s; overflow:hidden;
            display:flex; flex-direction:column;
        }
        .user-card:hover { box-shadow:0 10px 28px rgba(15,23,42,.1); transform:translateY(-3px); border-color:var(--primary); }

        .card-accent { height:5px; }
        .card-accent.ADMIN       { background:linear-gradient(90deg,#f59e0b,#f97316); }
        .card-accent.CLIENTE     { background:linear-gradient(90deg,#0ea5e9,#6366f1); }
        .card-accent.CONTRATISTA { background:linear-gradient(90deg,#10b981,#34d399); }
        .card-accent.sin-rol     { background:linear-gradient(90deg,#94a3b8,#cbd5e1); }

        .card-body { padding:1.2rem 1.4rem; flex:1; }

        .user-header { display:flex; align-items:center; gap:.85rem; margin-bottom:1rem; }
        .u-avatar {
            width:50px; height:50px; border-radius:13px;
            display:flex; align-items:center; justify-content:center;
            font-size:1.15rem; color:#fff; flex-shrink:0;
        }
        .u-avatar.ADMIN       { background:linear-gradient(135deg,#f59e0b,#f97316); }
        .u-avatar.CLIENTE     { background:linear-gradient(135deg,#0ea5e9,#6366f1); }
        .u-avatar.CONTRATISTA { background:linear-gradient(135deg,#10b981,#059669); }
        .u-avatar.sin-rol     { background:#94a3b8; }

        .u-name { font-size:1rem; font-weight:800; color:#0f172a; line-height:1.2; }
        .u-id   { font-size:.72rem; color:var(--muted); font-weight:600; margin-top:.1rem; }

        .role-badge {
            display:inline-flex; align-items:center; gap:.3rem;
            padding:.22rem .65rem; border-radius:6px;
            font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.3px;
        }
        .role-badge.ADMIN       { background:rgba(245,158,11,.12); color:#b45309; }
        .role-badge.CLIENTE     { background:rgba(14,165,233,.12); color:#0369a1; }
        .role-badge.CONTRATISTA { background:rgba(16,185,129,.12); color:#047857; }
        .role-badge.sin-rol     { background:#f1f5f9; color:var(--muted); }

        .u-info { display:flex; flex-direction:column; gap:.3rem; }
        .u-info-row { display:flex; align-items:center; gap:.45rem; font-size:.83rem; color:var(--muted); }
        .u-info-row i { width:15px; text-align:center; font-size:.77rem; color:var(--primary); flex-shrink:0; }
        .u-info-row span { color:#334155; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

        /* ── Card footer ── */
        .card-footer-bx {
            padding:.8rem 1.4rem;
            background:#fafbfc; border-top:1px solid var(--border);
            display:flex; gap:.4rem;
        }
        .btn-sm-bx {
            border:none; border-radius:8px; padding:.38rem .75rem;
            font:700 .78rem "Plus Jakarta Sans",sans-serif;
            cursor:pointer; display:inline-flex; align-items:center; gap:.3rem;
            transition:all .2s; text-decoration:none;
        }
        .btn-sm-bx:hover { transform:translateY(-1px); }
        .btn-edit   { background:#f1f5f9; color:#475569; border:1.5px solid var(--border); }
        .btn-edit:hover { background:#e2e8f0; color:#1e293b; }
        .btn-delete { background:transparent; color:var(--danger); border:1.5px solid var(--danger); }
        .btn-delete:hover { background:var(--danger); color:#fff; }

        /* ── Botón nuevo usuario ── */
        .btn-new {
            background:linear-gradient(135deg,#0ea5e9,#6366f1);
            color:#fff; border:none; border-radius:10px;
            padding:.55rem 1.1rem; font:700 .88rem "Plus Jakarta Sans",sans-serif;
            cursor:pointer; display:inline-flex; align-items:center; gap:.4rem;
            text-decoration:none; transition:all .2s; white-space:nowrap;
        }
        .btn-new:hover { transform:translateY(-2px); box-shadow:0 6px 18px rgba(14,165,233,.3); color:#fff; }

        /* ── Alerts ── */
        .bx-alert { border-radius:10px; padding:.7rem 1rem; font-weight:600; font-size:.88rem; margin-bottom:1.2rem; display:flex; align-items:center; gap:.5rem; }
        .bx-alert-ok  { background:rgba(16,185,129,.1); color:#047857; border:1px solid rgba(16,185,129,.2); }
        .bx-alert-err { background:rgba(239,68,68,.1);  color:#b91c1c;  border:1px solid rgba(239,68,68,.2); }

        /* ── Empty state ── */
        .empty-state { text-align:center; padding:3.5rem 1rem; color:var(--muted); }
        .empty-state i { font-size:2.8rem; margin-bottom:.8rem; display:block; opacity:.3; }
        .empty-state p { font-size:1.05rem; font-weight:700; margin-bottom:1rem; }

        /* ── No results ── */
        #noResults { display:none; text-align:center; padding:2rem; color:var(--muted); font-weight:600; font-size:.9rem; }

        @media (max-width:900px) {
            .stats-row { grid-template-columns:1fr 1fr; }
        }
        @media (max-width:600px) {
            .stats-row { grid-template-columns:1fr 1fr; }
            .users-grid { grid-template-columns:1fr; }
        }
    </style>
</head>
<body>
<div class="dash-layout">
    <th:block th:replace="~{fragments/sidebar :: sidebar('usuarios')}"></th:block>

    <div class="dash-content">
        <header class="dash-topbar">
            <h1 style="margin:0;font-size:1.2rem;font-weight:800">
                <i class="fas fa-users-cog" style="color:#0ea5e9;margin-right:.5rem"></i>
                Gestión de Usuarios
            </h1>
            <span sec:authentication="name" style="font-weight:600;color:#64748b;font-size:.9rem"></span>
        </header>

        <div class="dash-main">

            <!-- ALERTAS -->
            <div th:if="${ok}"    class="bx-alert bx-alert-ok"><i class="fas fa-check-circle"></i> <span th:text="${ok}"></span></div>
            <div th:if="${error}" class="bx-alert bx-alert-err"><i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span></div>

            <!-- STATS -->
            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-icon total"><i class="fas fa-users"></i></div>
                    <div>
                        <div class="stat-label">Total</div>
                        <div class="stat-num" th:text="${#lists.size(usuarios)}">0</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon admin"><i class="fas fa-shield-alt"></i></div>
                    <div>
                        <div class="stat-label">Admins</div>
                        <div class="stat-num" th:text="${#lists.size(usuarios.?[rol != null and rol.nombre == 'ADMIN'])}">0</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon cliente"><i class="fas fa-user"></i></div>
                    <div>
                        <div class="stat-label">Clientes</div>
                        <div class="stat-num" th:text="${#lists.size(usuarios.?[rol != null and rol.nombre == 'CLIENTE'])}">0</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon contr"><i class="fas fa-hard-hat"></i></div>
                    <div>
                        <div class="stat-label">Contratistas</div>
                        <div class="stat-num" th:text="${#lists.size(usuarios.?[rol != null and rol.nombre == 'CONTRATISTA'])}">0</div>
                    </div>
                </div>
            </div>

            <!-- TOOLBAR -->
            <div class="toolbar">
                <div class="search-wrap">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Buscar por nombre, email o rol…" oninput="filtrar()">
                </div>
                <a th:href="@{/admin/usuarios/nuevo}" class="btn-new ms-auto">
                    <i class="fas fa-plus"></i> Nuevo usuario
                </a>
            </div>

            <!-- FILTROS -->
            <div class="filter-pills">
                <span class="fpill active" onclick="setFiltro('todos', this)"><i class="fas fa-list"></i> Todos</span>
                <span class="fpill admin"  onclick="setFiltro('ADMIN', this)"><i class="fas fa-shield-alt"></i> Admin</span>
                <span class="fpill cliente" onclick="setFiltro('CLIENTE', this)"><i class="fas fa-user"></i> Clientes</span>
                <span class="fpill contr"  onclick="setFiltro('CONTRATISTA', this)"><i class="fas fa-hard-hat"></i> Contratistas</span>
            </div>

            <!-- GRID DE USUARIOS -->
            <div class="users-grid" id="usersGrid" th:if="${!#lists.isEmpty(usuarios)}">
                <div class="user-card"
                     th:each="u : ${usuarios}"
                     th:data-name="${u.nombre}"
                     th:data-email="${u.email}"
                     th:data-rol="${u.rol != null ? u.rol.nombre : 'sin-rol'}">

                    <!-- Barra de color según rol -->
                    <div class="card-accent"
                         th:classappend="${u.rol != null ? u.rol.nombre : 'sin-rol'}"></div>

                    <div class="card-body">
                        <!-- Header: avatar + nombre + badge -->
                        <div class="user-header">
                            <div class="u-avatar"
                                 th:classappend="${u.rol != null ? u.rol.nombre : 'sin-rol'}">
                                <i class="fas"
                                   th:classappend="${u.rol != null and u.rol.nombre == 'ADMIN'} ? 'fa-shield-alt'
                                                : (${u.rol != null and u.rol.nombre == 'CONTRATISTA'} ? 'fa-hard-hat' : 'fa-user')"></i>
                            </div>
                            <div style="flex:1;min-width:0">
                                <div class="u-name" th:text="${u.nombre}"></div>
                                <div class="u-id" th:text="'ID #' + ${u.id}"></div>
                            </div>
                            <span class="role-badge"
                                  th:classappend="${u.rol != null ? u.rol.nombre : 'sin-rol'}"
                                  th:text="${u.rol != null ? u.rol.nombre : 'SIN ROL'}"></span>
                        </div>

                        <!-- Info de contacto -->
                        <div class="u-info">
                            <div class="u-info-row">
                                <i class="fas fa-envelope"></i>
                                <span th:text="${u.email}"></span>
                            </div>
                            <div class="u-info-row" th:if="${u.telefono != null and !u.telefono.isEmpty()}">
                                <i class="fas fa-phone"></i>
                                <span th:text="${u.telefono}"></span>
                            </div>
                            <div class="u-info-row" th:if="${u.ciudad != null and !u.ciudad.isEmpty()}">
                                <i class="fas fa-city"></i>
                                <span th:text="${u.ciudad}"></span>
                            </div>
                            <div class="u-info-row" th:if="${u.direccion != null and !u.direccion.isEmpty()}">
                                <i class="fas fa-map-marker-alt"></i>
                                <span th:text="${u.direccion}"></span>
                            </div>
                        </div>
                    </div>

                    <!-- Footer con acciones -->
                    <div class="card-footer-bx">
                        <a class="btn-sm-bx btn-edit" th:href="@{/admin/usuarios/{id}/editar(id=${u.id})}">
                            <i class="fas fa-edit"></i> Editar
                        </a>
                        <form th:action="@{/admin/usuarios/{id}/eliminar(id=${u.id})}" method="post" class="d-inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn-sm-bx btn-delete"
                                    onclick="return confirm('¿Eliminar este usuario? Esta acción no se puede deshacer.')">
                                <i class="fas fa-trash"></i> Eliminar
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Sin resultados de búsqueda -->
            <div id="noResults">
                <i class="fas fa-search" style="font-size:1.8rem;opacity:.3;display:block;margin-bottom:.5rem"></i>
                No se encontraron usuarios con esa búsqueda.
            </div>

            <!-- Sin usuarios en BD -->
            <div th:if="${#lists.isEmpty(usuarios)}" class="empty-state">
                <i class="fas fa-users-slash"></i>
                <p>No hay usuarios registrados</p>
                <a th:href="@{/admin/usuarios/nuevo}" class="btn-new" style="margin:0 auto">
                    <i class="fas fa-plus"></i> Crear el primero
                </a>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    var filtroActivo = 'todos';

    function filtrar() {
        var q = document.getElementById('searchInput').value.toLowerCase().trim();
        var cards = document.querySelectorAll('.user-card');
        var visibles = 0;

        cards.forEach(function(card) {
            var nombre = (card.dataset.name  || '').toLowerCase();
            var email  = (card.dataset.email || '').toLowerCase();
            var rol    = (card.dataset.rol   || '').toLowerCase();

            var pasaBusqueda = !q || nombre.includes(q) || email.includes(q) || rol.includes(q);
            var pasaFiltro   = filtroActivo === 'todos' || rol === filtroActivo.toLowerCase();

            var visible = pasaBusqueda && pasaFiltro;
            card.style.display = visible ? '' : 'none';
            if (visible) visibles++;
        });

        document.getElementById('noResults').style.display = visibles === 0 ? 'block' : 'none';
    }

    function setFiltro(filtro, el) {
        filtroActivo = filtro;
        document.querySelectorAll('.fpill').forEach(function(p) { p.classList.remove('active'); });
        el.classList.add('active');
        filtrar();
    }
</script>
</body>
</html>
