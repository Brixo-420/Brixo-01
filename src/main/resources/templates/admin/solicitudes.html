<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Solicitudes de Contratista | Brixo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/design-system.css}">
    <link rel="stylesheet" th:href="@{/css/brixo.css}">
</head>
<body style="padding-top: 85px; background-color: #f8fafc; font-family: 'Inter', sans-serif;">
<div th:replace="~{fragments/navbar :: navbar(overlay=false)}"></div>

<div class="container my-4">
    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center gap-3 mb-4">
        <div>
            <h1 class="h3 fw-bold text-dark mb-1">
                <i class="fas fa-user-tie text-primary me-2"></i>Solicitudes de Contratista
            </h1>
            <p class="text-secondary small mb-0">Gestiona y aprueba los accesos para los nuevos contratistas del sistema.</p>
        </div>
        <div class="d-flex align-items-center gap-2">
            <span th:if="${pendientes > 0}" class="badge bg-danger-subtle text-danger px-3 py-2 rounded-pill fw-semibold" th:text="${pendientes} + ' pendientes'"></span>
            <a th:href="@{/admin/usuarios}" class="btn btn-outline-secondary btn-sm px-3 rounded-2 fw-medium">
                <i class="fas fa-arrow-left me-1"></i> Volver a usuarios
            </a>
        </div>
    </div>

    <div th:if="${ok}" class="alert alert-success border-0 shadow-sm d-flex align-items-center mb-4" role="alert">
        <i class="fas fa-check-circle me-2 fs-5"></i>
        <span th:text="${ok}" class="fw-medium"></span>
    </div>

    <div class="card border-0 shadow-sm rounded-3 overflow-hidden">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead class="table-light border-bottom text-secondary small uppercase fw-bold">
                <tr>
                    <th class="ps-4 py-3" style="width: 80px;">ID</th>
                    <th class="py-3">Usuario</th>
                    <th class="py-3">Email</th>
                    <th class="py-3">Fecha solicitud</th>
                    <th class="py-3">Estado</th>
                    <th class="py-3">Fecha respuesta</th>
                    <th class="text-end pe-4 py-3">Acciones</th>
                </tr>
                </thead>
                <tbody class="border-top-0 text-dark small">
                <tr th:each="s : ${solicitudes}" class="border-bottom hover-row">
                    <td class="ps-4 fw-semibold text-secondary" th:text="${s.id}"></td>
                    <td>
                        <div class="d-flex align-items-center">
                            <div class="avatar-sm bg-light text-primary rounded-circle d-flex align-items-center justify-content-center me-2" style="width: 32px; height: 32px;">
                                <i class="fas fa-user fs-6"></i>
                            </div>
                            <span class="fw-medium text-dark" th:text="${s.usuario.nombre}"></span>
                        </div>
                    </td>
                    <td class="text-secondary" th:text="${s.usuario.email}"></td>
                    <td class="text-secondary" th:text="${#temporals.format(s.fechaSolicitud, 'dd/MM/yyyy HH:mm')}"></td>
                    <td>
                        <span th:if="${s.estado.name() == 'PENDIENTE'}" class="badge bg-warning-subtle text-warning-emphasis px-2.5 py-1.5 rounded-pill fw-semibold">Pendiente</span>
                        <span th:if="${s.estado.name() == 'APROBADA'}" class="badge bg-success-subtle text-success-emphasis px-2.5 py-1.5 rounded-pill fw-semibold">Aprobada</span>
                        <span th:if="${s.estado.name() == 'RECHAZADA'}" class="badge bg-danger-subtle text-danger-emphasis px-2.5 py-1.5 rounded-pill fw-semibold">Rechazada</span>
                    </td>
                    <td>
                        <span th:if="${s.fechaRespuesta != null}" class="text-secondary" th:text="${#temporals.format(s.fechaRespuesta, 'dd/MM/yyyy HH:mm')}"></span>
                        <span th:if="${s.fechaRespuesta == null}" class="text-muted opacity-50">—</span>
                    </td>
                    <td class="text-end pe-4">
                        <div th:if="${s.estado.name() == 'PENDIENTE'}" class="d-inline-flex gap-2">
                            <form th:action="@{/admin/solicitudes/{id}/aprobar(id=${s.id})}" method="post" class="m-0">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-sm btn-success px-3 rounded-2 fw-medium d-inline-flex align-items-center"
                                        onclick="return confirm('¿Aprobar esta solicitud? El usuario pasará a ser contratista.')">
                                    <i class="fas fa-check me-1.5"></i> Aprobar
                                </button>
                            </form>
                            <form th:action="@{/admin/solicitudes/{id}/rechazar(id=${s.id})}" method="post" class="m-0">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-sm btn-outline-danger px-3 rounded-2 fw-medium d-inline-flex align-items-center"
                                        onclick="return confirm('¿Rechazar esta solicitud?')">
                                    <i class="fas fa-times me-1.5"></i> Rechazar
                                </button>
                            </form>
                        </div>
                        <span th:if="${s.estado.name() != 'PENDIENTE'}" class="badge bg-light text-secondary border px-2.5 py-1.5 rounded-2 fw-normal">Resuelta</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(solicitudes)}">
                    <td colspan="7" class="text-center text-muted py-5">
                        <i class="fas fa-inbox fs-2 text-muted opacity-50 mb-3 d-block"></i>
                        <span class="fw-medium">No hay solicitudes registradas en este momento.</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<style>
    .hover-row:hover {
        background-color: #fdfdfd;
    }
    .badge {
        font-size: 0.75rem;
        letter-spacing: 0.3px;
    }
</style>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div th:replace="~{fragments/navbar :: navbarJs}"></div>
</body>
</html>
