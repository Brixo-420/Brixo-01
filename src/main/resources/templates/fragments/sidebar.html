<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- ═══ CSS del sidebar — insertar en <head> ═══ -->
<th:block th:fragment="sidebarCss">
<style>
    html, body { margin:0; padding:0; font-family:"Plus Jakarta Sans",sans-serif; background:#f8fafc; color:#0f172a; }
    .dash-layout { display:flex; min-height:100vh; }

    /* SIDEBAR */
    .dash-sidebar {
        width:240px; flex-shrink:0;
        background:linear-gradient(160deg,#0f172a 0%,#1a1f3a 100%);
        color:#fff;
        padding:1.6rem 1rem;
        position:fixed; left:0; top:0; bottom:0;
        overflow-y:auto;
        box-shadow:4px 0 12px rgba(15,23,42,.12);
        z-index:100;
    }
    .dash-logo {
        font-size:1.3rem; font-weight:800; letter-spacing:2px;
        background:linear-gradient(135deg,#0ea5e9,#6366f1);
        border-radius:10px; padding:.5rem .8rem;
        display:block; text-align:center; color:#fff;
        text-decoration:none; margin-bottom:1.8rem;
    }
    .dash-nav { display:flex; flex-direction:column; gap:.3rem; }
    .dash-nav a {
        color:#94a3b8; text-decoration:none;
        padding:.75rem 1rem; border-radius:9px;
        font-weight:600; font-size:.9rem;
        display:flex; align-items:center; gap:.65rem;
        border-left:3px solid transparent;
        transition:all .2s;
    }
    .dash-nav a i { width:18px; text-align:center; font-size:.85rem; }
    .dash-nav a:hover, .dash-nav a.active {
        background:#1e293b; color:#fff;
        border-left-color:#0ea5e9;
    }
    .dash-nav .nav-divider { height:1px; background:rgba(255,255,255,.07); margin:.5rem 0; }

    /* CONTENT */
    .dash-content { margin-left:240px; flex:1; display:flex; flex-direction:column; min-height:100vh; }

    /* TOPBAR */
    .dash-topbar {
        background:#fff; border-bottom:1px solid #e2e8f0;
        padding:1rem 2rem;
        display:flex; justify-content:space-between; align-items:center;
        position:sticky; top:0; z-index:50;
        box-shadow:0 2px 8px rgba(15,23,42,.05);
    }
    .dash-topbar h1 { margin:0; font-size:1.2rem; font-weight:800; }
    .dash-main { padding:2rem; flex:1; }

    /* Responsive */
    @media (max-width:900px) {
        .dash-sidebar { position:static; width:100%; flex-direction:row; }
        .dash-content { margin-left:0; }
    }
</style>
</th:block>

<!-- ═══ Sidebar nav — usar con th:replace ═══ -->
<aside th:fragment="sidebar(activePage)" class="dash-sidebar">
    <a class="dash-logo" th:href="@{/}">BRIXO</a>

    <nav class="dash-nav">
        <a th:href="@{/dashboard}" th:classappend="${activePage == 'inicio'} ? 'active' : ''">
            <i class="fas fa-home"></i> Inicio
        </a>
        <a th:href="@{/servicios}" th:classappend="${activePage == 'servicios'} ? 'active' : ''">
            <i class="fas fa-briefcase"></i> Servicios
        </a>
        <a th:href="@{/notificaciones}" th:classappend="${activePage == 'notificaciones'} ? 'active' : ''">
            <i class="fas fa-bell"></i> Notificaciones
        </a>
        <a th:href="@{/resenas}" th:classappend="${activePage == 'resenas'} ? 'active' : ''">
            <i class="fas fa-star"></i> Mis reseñas
        </a>
        <a th:href="@{/perfil}" th:classappend="${activePage == 'perfil'} ? 'active' : ''">
            <i class="fas fa-user-circle"></i> Mi Perfil
        </a>

        <div class="nav-divider" sec:authorize="hasRole('ROLE_CLIENTE')"></div>
        <a sec:authorize="hasRole('ROLE_CLIENTE')" th:href="@{/servicios/nuevo}"
           th:classappend="${activePage == 'nuevo-servicio'} ? 'active' : ''">
            <i class="fas fa-plus-circle"></i> Publicar tarea
        </a>

        <div class="nav-divider" sec:authorize="hasRole('ROLE_ADMIN')"></div>
        <a sec:authorize="hasRole('ROLE_ADMIN')" th:href="@{/admin/usuarios}"
           th:classappend="${activePage == 'usuarios'} ? 'active' : ''">
            <i class="fas fa-users-cog"></i> Gestionar usuarios
        </a>
        <a sec:authorize="hasRole('ROLE_ADMIN')" th:href="@{/admin/solicitudes}"
           th:classappend="${activePage == 'solicitudes'} ? 'active' : ''">
            <i class="fas fa-user-tie"></i> Solicitudes
        </a>
    </nav>
</aside>

</html>
