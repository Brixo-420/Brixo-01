<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Fondo decorativo — incluir con: th:replace="~{fragments/bg-icons :: bg-icons}" -->
<div th:fragment="bg-icons" aria-hidden="true"
     style="position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0">

    <!-- Esquina superior izquierda -->
    <i class="fas fa-hard-hat"       style="position:absolute;top:3%;left:2%;font-size:7rem;color:#0ea5e9;opacity:.10;transform:rotate(-15deg)"></i>
    <i class="fas fa-wrench"         style="position:absolute;top:22%;left:6%;font-size:5.5rem;color:#6366f1;opacity:.09;transform:rotate(20deg)"></i>
    <i class="fas fa-cogs"           style="position:absolute;top:50%;left:1%;font-size:8rem;color:#0ea5e9;opacity:.08;transform:rotate(-10deg)"></i>
    <i class="fas fa-bolt"           style="position:absolute;top:72%;left:5%;font-size:6rem;color:#f59e0b;opacity:.09;transform:rotate(12deg)"></i>
    <i class="fas fa-ruler-combined" style="position:absolute;top:88%;left:3%;font-size:5rem;color:#6366f1;opacity:.09;transform:rotate(-30deg)"></i>

    <!-- Centro izquierda / Centro -->
    <i class="fas fa-tools"          style="position:absolute;top:8%;left:28%;font-size:5rem;color:#10b981;opacity:.08;transform:rotate(15deg)"></i>
    <i class="fas fa-faucet"         style="position:absolute;top:65%;left:22%;font-size:5.5rem;color:#0ea5e9;opacity:.08;transform:rotate(-20deg)"></i>
    <i class="fas fa-screwdriver"    style="position:absolute;top:38%;left:42%;font-size:4.5rem;color:#f59e0b;opacity:.07;transform:rotate(-45deg)"></i>
    <i class="fas fa-paint-roller"   style="position:absolute;top:82%;left:38%;font-size:5rem;color:#6366f1;opacity:.08;transform:rotate(25deg)"></i>

    <!-- Centro derecha -->
    <i class="fas fa-hammer"         style="position:absolute;top:15%;left:58%;font-size:6rem;color:#6366f1;opacity:.09;transform:rotate(22deg)"></i>
    <i class="fas fa-cogs"           style="position:absolute;top:55%;left:52%;font-size:7.5rem;color:#0ea5e9;opacity:.08;transform:rotate(-8deg)"></i>
    <i class="fas fa-bolt"           style="position:absolute;top:78%;left:62%;font-size:5.5rem;color:#f59e0b;opacity:.09;transform:rotate(18deg)"></i>

    <!-- Esquina superior derecha -->
    <i class="fas fa-hard-hat"       style="position:absolute;top:2%;left:82%;font-size:6.5rem;color:#0ea5e9;opacity:.10;transform:rotate(10deg)"></i>
    <i class="fas fa-wrench"         style="position:absolute;top:28%;left:88%;font-size:7rem;color:#6366f1;opacity:.09;transform:rotate(-25deg)"></i>
    <i class="fas fa-tools"          style="position:absolute;top:50%;left:92%;font-size:6rem;color:#10b981;opacity:.09;transform:rotate(15deg)"></i>
    <i class="fas fa-hammer"         style="position:absolute;top:70%;left:85%;font-size:7.5rem;color:#0ea5e9;opacity:.09;transform:rotate(-12deg)"></i>
    <i class="fas fa-paint-roller"   style="position:absolute;top:90%;left:90%;font-size:5.5rem;color:#6366f1;opacity:.09;transform:rotate(30deg)"></i>

</div>

</body>
</html>
