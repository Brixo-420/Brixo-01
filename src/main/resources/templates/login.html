<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | Brixo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #f1f5f9;
            --card: #ffffff;
            --ink: #0f172a;
            --muted: #64748b;
            --accent: #0ea5e9;
            --danger: #ef4444;
            --ok: #16a34a;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Manrope", sans-serif;
            background: radial-gradient(circle at 15% 20%, #dbeafe 0%, #f1f5f9 48%, #e2e8f0 100%);
            display: grid;
            place-items: center;
            color: var(--ink);
            padding: 1rem;
        }

        .card {
            width: 100%;
            max-width: 430px;
            background: var(--card);
            border-radius: 16px;
            border: 1px solid #dbe2ea;
            box-shadow: 0 20px 45px rgba(15, 23, 42, .10);
            padding: 1.3rem;
        }

        .brand {
            margin: 0 0 .4rem;
            font-size: 1.9rem;
            font-weight: 800;
            color: #0284c7;
            text-align: center;
            letter-spacing: .5px;
        }

        .subtitle {
            text-align: center;
            color: var(--muted);
            margin: 0 0 1.2rem;
            font-size: .95rem;
        }

        .field { margin-bottom: .85rem; }

        label {
            display: block;
            margin-bottom: .3rem;
            font-size: .9rem;
            font-weight: 700;
        }

        input {
            width: 100%;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: .72rem .78rem;
            font: inherit;
        }

        input:focus {
            outline: 2px solid rgba(14, 165, 233, .25);
            border-color: #38bdf8;
        }

        .btn {
            width: 100%;
            border: none;
            border-radius: 10px;
            background: var(--accent);
            color: #fff;
            font-weight: 800;
            padding: .75rem .9rem;
            cursor: pointer;
        }

        .alert {
            border-radius: 10px;
            padding: .65rem .75rem;
            margin-bottom: .9rem;
            font-size: .9rem;
            font-weight: 600;
        }

        .alert-error {
            color: #fff;
            background: var(--danger);
        }

        .alert-ok {
            color: #fff;
            background: var(--ok);
        }

        .field-msg {
            font-size: .8rem;
            margin-top: .25rem;
            display: none;
            font-weight: 600;
        }
        .field-msg.error { color: var(--danger); }
        .field-msg.show { display: block; }

        input.invalid { border-color: var(--danger); }
        input.valid { border-color: #16a34a; }

        .alert-warn {
            color: #92400e;
            background: #fef3c7;
            border: 1px solid #fde68a;
        }

        .btn:disabled {
            opacity: .5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
<section class="card">
    <h1 class="brand">BRIXO</h1>
    <p class="subtitle">Inicia sesión para entrar al panel</p>

    <div th:if="${bloqueado}" class="alert alert-warn">
        <span th:text="${mensajeBloqueo}">Cuenta bloqueada temporalmente.</span>
    </div>
    <div th:if="${param.error}" th:unless="${bloqueado}" class="alert alert-error">Credenciales inválidas.</div>
    <div th:if="${param.logout}" class="alert alert-ok">Sesión cerrada correctamente.</div>
    <div th:if="${registroExitoso}" class="alert alert-ok" th:text="${registroExitoso}"></div>

    <form id="loginForm" th:action="@{/login}" method="post" novalidate>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="field">
            <label for="username">Correo electrónico</label>
            <input id="username" name="username" type="email" required maxlength="120"
                   placeholder="correo@ejemplo.com">
            <div class="field-msg error" id="usernameMsg">Ingresa un correo electrónico válido</div>
        </div>
        <div class="field">
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" required minlength="6" maxlength="120"
                   placeholder="Mínimo 6 caracteres">
            <div class="field-msg error" id="passwordMsg">La contraseña debe tener mínimo 6 caracteres</div>
        </div>
        <button type="submit" class="btn" id="loginBtn">Iniciar sesión</button>
    </form>

    <div style="text-align:center;margin-top:1rem;font-size:.9rem;color:var(--muted)">
        ¿No tienes cuenta? <a th:href="@{/registro}" style="color:var(--accent);font-weight:700;text-decoration:none">Regístrate aquí</a>
    </div>
</section>

<script>
(function() {
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('username');
    const pwInput = document.getElementById('password');
    const emailMsg = document.getElementById('usernameMsg');
    const pwMsg = document.getElementById('passwordMsg');

    function validateEmail() {
        const v = emailInput.value.trim();
        const valid = v.length > 0 && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
        emailInput.classList.toggle('invalid', !valid && v.length > 0);
        emailInput.classList.toggle('valid', valid);
        emailMsg.classList.toggle('show', !valid && v.length > 0);
        return valid;
    }

    function validatePassword() {
        const v = pwInput.value;
        const valid = v.length >= 6;
        pwInput.classList.toggle('invalid', !valid && v.length > 0);
        pwInput.classList.toggle('valid', valid);
        pwMsg.classList.toggle('show', !valid && v.length > 0);
        return valid;
    }

    emailInput.addEventListener('blur', validateEmail);
    emailInput.addEventListener('input', validateEmail);
    pwInput.addEventListener('blur', validatePassword);
    pwInput.addEventListener('input', validatePassword);

    form.addEventListener('submit', function(e) {
        const e1 = validateEmail();
        const e2 = validatePassword();
        if (!e1 || !e2) {
            e.preventDefault();
        }
    });
})();
</script>
</body>
</html>
