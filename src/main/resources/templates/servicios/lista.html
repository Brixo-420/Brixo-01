<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Servicios | Brixo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/design-system.css}">
    <link rel="stylesheet" th:href="@{/css/brixo.css}">
    <th:block th:replace="~{fragments/sidebar :: sidebarCss}"></th:block>
    <style>
        :root {
            --primary: #0ea5e9;
            --primary-dark: #0284c7;
            --secondary: #6366f1;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; }
        html, body { margin:0; padding:0; font-family:"Plus Jakarta Sans",sans-serif; background:var(--bg); color:var(--text); }

        .page-wrap { max-width:1280px; margin:0 auto; padding:90px 1.5rem 3rem; }

        /* Header */
        .page-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; flex-wrap:wrap; gap:1rem; }
        .page-header h1 { font-size:1.6rem; font-weight:800; margin:0; display:flex; align-items:center; gap:.6rem; }
        .page-header h1 i { color:var(--primary); }
        .header-actions { display:flex; gap:.6rem; flex-wrap:wrap; }

        /* Buttons */
        .btn-bx { border:none; border-radius:10px; padding:.6rem 1.1rem; font-weight:700; cursor:pointer; text-decoration:none; font-size:.88rem; transition:all .25s; display:inline-flex; align-items:center; gap:.4rem; }
        .btn-bx:hover { transform:translateY(-2px); box-shadow:0 6px 16px rgba(0,0,0,.12); }
        .btn-bx-primary { background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff; }
        .btn-bx-primary:hover { color:#fff; }
        .btn-bx-dark { background:var(--text); color:#fff; }
        .btn-bx-dark:hover { color:#fff; }
        .btn-bx-outline { background:transparent; border:1.5px solid var(--border); color:var(--text); }
        .btn-bx-outline:hover { border-color:var(--primary); color:var(--primary); background:rgba(14,165,233,.04); }
        .btn-bx-success { background:linear-gradient(135deg,var(--success),#059669); color:#fff; }
        .btn-bx-success:hover { color:#fff; }
        .btn-bx-danger { background:transparent; border:1.5px solid var(--danger); color:var(--danger); }
        .btn-bx-danger:hover { background:var(--danger); color:#fff; }
        .btn-bx-sm { padding:.4rem .7rem; font-size:.8rem; border-radius:8px; }

        /* Cards */
        .bx-card { background:var(--card); border-radius:14px; border:1px solid var(--border); box-shadow:0 2px 8px rgba(15,23,42,.04); padding:1.2rem 1.4rem; margin-bottom:1.2rem; }

        /* Filters */
        .filter-bar { display:grid; grid-template-columns:1fr 1fr 1fr auto; gap:.8rem; align-items:end; }
        .filter-bar.has-email { grid-template-columns:1fr 1fr 1fr 1fr auto; }
        .filter-bar label { font-size:.82rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; margin-bottom:.3rem; display:block; }
        .filter-bar input, .filter-bar select { border:1.5px solid var(--border); border-radius:9px; padding:.55rem .8rem; font:inherit; font-size:.9rem; width:100%; transition:border-color .2s; }
        .filter-bar input:focus, .filter-bar select:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(14,165,233,.12); }
        .filter-actions { display:flex; gap:.4rem; }

        /* Import */
        .import-bar { display:flex; gap:.8rem; align-items:end; }
        .import-bar .file-input { flex:1; }
        .import-bar label { font-size:.82rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; margin-bottom:.3rem; display:block; }
        .import-bar input[type=file] { border:1.5px solid var(--border); border-radius:9px; padding:.5rem .8rem; font:inherit; font-size:.88rem; width:100%; }

        /* Service cards grid */
        .services-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(380px,1fr)); gap:1rem; }

        .svc-card { background:var(--card); border-radius:14px; border:1px solid var(--border); box-shadow:0 2px 10px rgba(15,23,42,.05); transition:all .3s; overflow:hidden; display:flex; flex-direction:column; }
        .svc-card:hover { box-shadow:0 8px 24px rgba(15,23,42,.1); transform:translateY(-3px); border-color:var(--primary); }

        .svc-card-top { height:4px; }
        .svc-card-top.abierto { background:linear-gradient(90deg,var(--warning),#fbbf24); }
        .svc-card-top.en_cotizacion { background:linear-gradient(90deg,var(--secondary),#818cf8); }
        .svc-card-top.en_proceso { background:linear-gradient(90deg,var(--primary),var(--secondary)); }
        .svc-card-top.cerrado { background:linear-gradient(90deg,var(--success),#34d399); }

        .svc-card-body { padding:1.2rem 1.4rem; flex:1; display:flex; flex-direction:column; }

        .svc-card-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:.7rem; gap:.6rem; }
        .svc-card-title { font-size:1.05rem; font-weight:700; margin:0; line-height:1.3; flex:1; }
        .svc-card-id { font-size:.75rem; color:var(--muted); font-weight:600; white-space:nowrap; }

        .svc-badge { display:inline-flex; align-items:center; gap:.3rem; padding:.25rem .65rem; border-radius:6px; font-size:.75rem; font-weight:700; text-transform:uppercase; letter-spacing:.3px; }
        .svc-badge.abierto { background:rgba(245,158,11,.12); color:#b45309; }
        .svc-badge.en_cotizacion { background:rgba(99,102,241,.12); color:#4338ca; }
        .svc-badge.en_proceso { background:rgba(14,165,233,.12); color:#0369a1; }
        .svc-badge.cerrado { background:rgba(16,185,129,.12); color:#047857; }

        .svc-meta { display:grid; grid-template-columns:1fr 1fr; gap:.5rem .8rem; margin:.7rem 0; font-size:.85rem; }
        .svc-meta-item { display:flex; align-items:center; gap:.4rem; color:var(--muted); }
        .svc-meta-item i { width:14px; text-align:center; font-size:.78rem; }
        .svc-meta-item strong { color:var(--text); font-weight:600; }

        .svc-people { display:flex; gap:1rem; font-size:.8rem; color:var(--muted); padding-top:.6rem; border-top:1px solid var(--border); margin-top:auto; }
        .svc-people span { display:flex; align-items:center; gap:.3rem; }
        .svc-people i { font-size:.72rem; }

        .svc-card-actions { display:flex; gap:.4rem; flex-wrap:wrap; padding:.8rem 1.4rem; background:#fafbfc; border-top:1px solid var(--border); }

        /* Alerts */
        .bx-alert { border-radius:10px; padding:.7rem 1rem; font-weight:600; font-size:.9rem; margin-bottom:1rem; display:flex; align-items:center; gap:.5rem; }
        .bx-alert-ok { background:rgba(16,185,129,.1); color:#047857; border:1px solid rgba(16,185,129,.2); }
        .bx-alert-err { background:rgba(239,68,68,.1); color:#b91c1c; border:1px solid rgba(239,68,68,.2); }

        .empty-state { text-align:center; padding:3rem 1rem; color:var(--muted); }
        .empty-state i { font-size:3rem; margin-bottom:1rem; opacity:.4; }
        .empty-state p { font-size:1.05rem; font-weight:600; }

        @media (max-width:900px) {
            .services-grid { grid-template-columns:1fr; }
            .filter-bar, .filter-bar.has-email { grid-template-columns:1fr; }
            .page-header { flex-direction:column; align-items:flex-start; }
        }
    </style>
</head>
<body>
<th:block th:replace="~{fragments/bg-icons :: bg-icons}"></th:block>
<div class="dash-layout" style="position:relative;z-index:1">
    <th:block th:replace="~{fragments/sidebar :: sidebar('servicios')}"></th:block>

    <div class="dash-content">
        <header class="dash-topbar">
            <h1><i class="fas fa-tools" style="color:#0ea5e9;margin-right:.5rem"></i> Servicios</h1>
            <div style="display:flex;gap:.6rem;align-items:center">
                <a th:if="${esCliente}" th:href="@{/servicios/nuevo}" class="btn-bx btn-bx-primary">
                    <i class="fas fa-plus"></i> Nuevo servicio
                </a>
                <span sec:authentication="name" style="font-weight:600;color:#64748b;font-size:.9rem"></span>
            </div>
        </header>

        <div class="dash-main">
            <div th:if="${ok}" class="bx-alert bx-alert-ok"><i class="fas fa-check-circle"></i> <span th:text="${ok}"></span></div>
            <div th:if="${error}" class="bx-alert bx-alert-err"><i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span></div>

            <!-- Tira decorativa construcción -->
            <div style="display:flex;gap:.85rem;align-items:center;margin-bottom:1rem;opacity:.13;color:#0ea5e9;font-size:1.4rem;pointer-events:none" aria-hidden="true">
                <i class="fas fa-hard-hat"></i>
                <i class="fas fa-hammer"></i>
                <i class="fas fa-wrench"></i>
                <i class="fas fa-bolt"></i>
                <i class="fas fa-tools"></i>
                <i class="fas fa-paint-roller"></i>
                <i class="fas fa-faucet"></i>
                <i class="fas fa-cogs"></i>
            </div>

    <!-- FILTROS -->
    <div class="bx-card">
        <form method="get" th:action="@{/servicios}">
            <div class="filter-bar" th:classappend="${esAdmin} ? 'has-email' : ''">
                <div>
                    <label for="titulo">Buscar</label>
                    <input id="titulo" name="titulo" type="text" th:value="${titulo}" placeholder="Título, cliente o contratista...">
                </div>
                <div>
                    <label for="estado">Estado</label>
                    <select id="estado" name="estado">
                        <option value="">Todos</option>
                        <option th:each="e : ${estados}" th:value="${e.name()}" th:text="${e.name()}" th:selected="${estado != null and estado.equals(e.name())}"></option>
                    </select>
                </div>
                <div th:if="${esAdmin}">
                    <label for="emailCliente">Email cliente</label>
                    <input id="emailCliente" name="emailCliente" type="text" th:value="${emailCliente}" placeholder="email@...">
                </div>
                <div class="filter-actions">
                    <button type="submit" class="btn-bx btn-bx-primary"><i class="fas fa-search"></i> Filtrar</button>
                    <a class="btn-bx btn-bx-outline" th:href="@{/servicios}"><i class="fas fa-times"></i></a>
                    <button type="button" class="btn-bx btn-bx-outline" title="Exportar Excel" style="color:#10b981;border-color:#10b981" onclick="exportarExcel()"><i class="fas fa-file-excel"></i> Excel</button>
                </div>
            </div>
        </form>
    </div>

    <!-- SERVICIOS GRID -->
    <div class="services-grid" th:if="${!#lists.isEmpty(servicios)}">
        <div class="svc-card" th:each="s : ${servicios}">
            <div class="svc-card-top" th:classappend="${#strings.toLowerCase(s.estado.name())}"></div>
            <div class="svc-card-body">
                <div class="svc-card-header">
                    <h3 class="svc-card-title" th:text="${s.titulo}"></h3>
                    <span class="svc-card-id" th:text="'#' + ${s.id}"></span>
                </div>
                <span class="svc-badge" th:classappend="${#strings.toLowerCase(s.estado.name())}" th:text="${s.estado}"></span>

                <div class="svc-meta">
                    <div class="svc-meta-item">
                        <i class="fas fa-map-marker-alt"></i>
                        <strong th:text="${s.ubicacion}"></strong>
                    </div>
                    <div class="svc-meta-item">
                        <i class="fas fa-dollar-sign"></i>
                        <strong th:if="${!s.presupuestoNegociable}" th:text="'$' + ${#numbers.formatDecimal(s.presupuesto, 1, 'POINT', 2, 'COMMA')}"></strong>
                        <strong th:if="${s.presupuestoNegociable}" style="color:#6366f1">A negociar</strong>
                    </div>
                    <div class="svc-meta-item">
                        <i class="fas fa-calendar"></i>
                        <span th:text="${#temporals.format(s.fechaCreacion, 'dd/MM/yyyy')}"></span>
                    </div>
                    <div class="svc-meta-item">
                        <i class="fas fa-tag"></i>
                        <span th:text="${s.tipo != null ? s.tipo.displayName : '-'}"></span>
                    </div>
                </div>

                <div class="svc-people">
                    <span><i class="fas fa-user"></i> <span th:text="${s.cliente != null ? s.cliente.nombre : '-'}"></span></span>
                    <span><i class="fas fa-hard-hat"></i> <span th:text="${s.contratistaAsignado != null ? s.contratistaAsignado.nombre : 'Sin asignar'}"></span></span>
                </div>
            </div>

            <div class="svc-card-actions">
                <a class="btn-bx btn-bx-outline btn-bx-sm" th:href="@{/servicios/{id}/detalle(id=${s.id})}">
                    <i class="fas fa-eye"></i> Ver
                </a>
                <a th:if="${esContratista and s.estado.name() == 'ABIERTO'}"
                   class="btn-bx btn-bx-success btn-bx-sm" th:href="@{/servicios/{id}/detalle(id=${s.id})}">
                    <i class="fas fa-file-invoice-dollar"></i> Cotizar
                </a>
                <form th:if="${(esContratista or esAdmin) and s.estado.name() == 'EN_COTIZACION' and s.contratistaAsignado != null and (esAdmin or s.contratistaAsignado.email == #authentication.name)}"
                      th:action="@{/servicios/{id}/iniciar(id=${s.id})}" method="post" class="d-inline">
                    <button type="submit" class="btn-bx btn-bx-success btn-bx-sm" onclick="return confirm('¿Iniciar trabajo?')"><i class="fas fa-play"></i> Iniciar</button>
                </form>
                <form th:if="${(esContratista or esAdmin) and s.estado.name() == 'EN_PROCESO' and s.contratistaAsignado != null and (esAdmin or s.contratistaAsignado.email == #authentication.name)}"
                      th:action="@{/servicios/{id}/finalizar(id=${s.id})}" method="post" class="d-inline">
                    <button type="submit" class="btn-bx btn-bx-success btn-bx-sm"><i class="fas fa-check"></i> Finalizar</button>
                </form>
                <a th:if="${esCliente and s.estado.name() == 'ABIERTO' and s.cliente != null and s.cliente.email == #authentication.name and s.contratistaAsignado == null}"
                   class="btn-bx btn-bx-outline btn-bx-sm" th:href="@{/servicios/{id}/editar(id=${s.id})}">
                    <i class="fas fa-edit"></i> Editar
                </a>
                <form th:if="${esCliente and s.estado.name() == 'ABIERTO' and s.cliente != null and s.cliente.email == #authentication.name and s.contratistaAsignado == null}"
                      th:action="@{/servicios/{id}/eliminar(id=${s.id})}" method="post" class="d-inline">
                    <button type="submit" class="btn-bx btn-bx-danger btn-bx-sm" onclick="return confirm('¿Eliminar servicio?')">
                        <i class="fas fa-trash"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- EMPTY STATE -->
    <div th:if="${#lists.isEmpty(servicios)}" class="empty-state">
        <i class="fas fa-inbox"></i>
        <p>No se encontraron servicios</p>
        <a th:if="${esCliente}" th:href="@{/servicios/nuevo}" class="btn-bx btn-bx-primary" style="margin-top:.5rem">
            <i class="fas fa-plus"></i> Crear el primero
        </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function exportarExcel() {
    var params = new URLSearchParams();
    var titulo = document.getElementById('titulo');
    var estado = document.getElementById('estado');
    var emailCliente = document.getElementById('emailCliente');

    if (titulo && titulo.value.trim())        params.append('titulo', titulo.value.trim());
    if (estado && estado.value)               params.append('estado', estado.value);
    if (emailCliente && emailCliente.value.trim()) params.append('emailCliente', emailCliente.value.trim());

    var url = '/servicios/reporte.xlsx' + (params.toString() ? '?' + params.toString() : '');
    window.location.href = url;
}
</script>
</body>
</html>
