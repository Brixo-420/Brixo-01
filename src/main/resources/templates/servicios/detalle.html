<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalles del Servicio | Brixo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/design-system.css}">
    <link rel="stylesheet" th:href="@{/css/brixo.css}">
    <style>
        .detail-section {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid #e2e8f0;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
        }

        .detail-label {
            font-weight: 700;
            color: #64748b;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }

        .detail-value {
            font-size: 1.1rem;
            color: #0f172a;
            font-weight: 600;
            word-break: break-word;
        }

        .detail-row {
            margin-bottom: 1.5rem;
        }

        .detail-row:last-child {
            margin-bottom: 0;
        }

        .status-badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .status-abierto {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.15) 0%, rgba(251, 191, 36, 0.15) 100%);
            color: #d97706;
        }

        .status-en-proceso {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.15) 0%, rgba(99, 102, 241, 0.15) 100%);
            color: #2563eb;
        }

        .status-cerrado {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15) 0%, rgba(52, 211, 153, 0.15) 100%);
            color: #059669;
        }

        .header-card {
            background: linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%);
            color: white;
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 8px 16px rgba(14, 165, 233, 0.2);
        }

        .header-card h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        .header-card p {
            font-size: 1rem;
            margin: 0;
            opacity: 0.95;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .btn-group-actions {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        .btn {
            border: none;
            border-radius: 10px;
            padding: 0.65rem 1.2rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
        }

        .btn-primary {
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            color: #fff;
        }

        .btn-primary:hover {
            color: #fff;
        }

        .btn-secondary {
            background: #f1f5f9;
            color: #0f172a;
            border: 1px solid #e2e8f0;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
            color: #0f172a;
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #fff;
        }

        .btn-success:hover {
            color: #fff;
        }

        .divider {
            border-top: 1px solid #e2e8f0;
            margin: 2rem 0;
        }
    </style>
</head>
<body style="padding-top:70px;background:#f8fafc">
<div th:replace="~{fragments/navbar :: navbar(overlay=false)}"></div>

<div class="container">
    <h1 class="h3 mb-3">Detalles del Servicio</h1>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <!-- HEADER CARD -->
    <div class="header-card">
        <h1 th:text="${servicio.titulo}"></h1>
        <p>
            <i class="fas fa-map-marker-alt"></i>
            <span th:text="${servicio.ubicacion}"></span>
        </p>
    </div>

    <!-- STATE AND TYPE -->
    <div class="detail-section">
        <div class="info-grid">
            <div class="detail-row">
                <div class="detail-label"><i class="fas fa-flag"></i> Estado</div>
                <div>
                    <span class="status-badge" 
                          th:classappend="'status-' + ${#strings.toLowerCase(servicio.estado.name().replace('_', '-'))}"
                          th:text="${servicio.estado}"></span>
                </div>
            </div>
            <div class="detail-row">
                <div class="detail-label"><i class="fas fa-tag"></i> Tipo de Servicio</div>
                <div class="detail-value" th:text="${servicio.tipo.displayName}"></div>
            </div>
            <div class="detail-row">
                <div class="detail-label"><i class="fas fa-dollar-sign"></i> Presupuesto</div>
                <div class="detail-value" th:text="${#numbers.formatDecimal(servicio.presupuesto, 1, 'POINT', 2, 'COMMA')} + ' €'"></div>
            </div>
            <div class="detail-row">
                <div class="detail-label"><i class="fas fa-calendar"></i> Fecha de Creación</div>
                <div class="detail-value" th:text="${#temporals.format(servicio.fechaCreacion, 'dd/MM/yyyy HH:mm')}"></div>
            </div>
        </div>
    </div>

    <!-- DESCRIPTION -->
    <div class="detail-section">
        <div class="detail-label"><i class="fas fa-align-left"></i> Descripción</div>
        <div class="detail-value" style="white-space: pre-wrap; line-height: 1.6;" th:text="${servicio.descripcion}"></div>
    </div>

    <!-- CLIENT AND CONTRACTOR INFO -->
    <div class="detail-section">
        <div class="row">
            <div class="col-md-6 pb-3 pb-md-0">
                <div class="detail-label"><i class="fas fa-user-tie"></i> Cliente</div>
                <div class="detail-value" th:text="${servicio.cliente != null ? servicio.cliente.email : 'No asignado'}"></div>
            </div>
            <div class="col-md-6">
                <div class="detail-label"><i class="fas fa-helmet-safety"></i> Contratista</div>
                <div class="detail-value" th:text="${servicio.contratistaAsignado != null ? servicio.contratistaAsignado.email : 'Sin asignar'}"></div>
            </div>
        </div>
    </div>

    <!-- ACTIONS -->
    <div class="detail-section">
        <div class="btn-group-actions">
            <!-- Para contratista sin asignar: Asignarse -->
            <form th:if="${esContratista and servicio.estado.name() == 'ABIERTO' and servicio.contratistaAsignado == null}"
                  th:action="@{/servicios/{id}/asignarme(id=${servicio.id})}"
                  method="post" style="display:inline;">
                <button type="submit" class="btn btn-success">
                    <i class="fas fa-hand-paper"></i> Asignarme al Servicio
                </button>
            </form>

            <!-- Para contratista asignado en ABIERTO: Iniciar -->
            <form th:if="${esContratista and servicio.estado.name() == 'ABIERTO' and esContratistaAsignado}"
                  th:action="@{/servicios/{id}/iniciar(id=${servicio.id})}"
                  method="post" style="display:inline;">
                <button type="submit" class="btn btn-success">
                    <i class="fas fa-play"></i> Iniciar Trabajo
                </button>
            </form>

            <!-- Para contratista asignado en EN_PROCESO: Finalizar -->
            <form th:if="${esContratista and servicio.estado.name() == 'EN_PROCESO' and esContratistaAsignado}"
                  th:action="@{/servicios/{id}/finalizar(id=${servicio.id})}"
                  method="post" style="display:inline;">
                <button type="submit" class="btn btn-success">
                    <i class="fas fa-check"></i> Marcar como Completado
                </button>
            </form>

            <!-- Para cliente propietario: Editar (solo si ABIERTO y sin contratista) -->
            <a th:if="${esClientePropietario and servicio.estado.name() == 'ABIERTO' and servicio.contratistaAsignado == null}"
               class="btn btn-primary"
               th:href="@{/servicios/{id}/editar(id=${servicio.id})}">
                <i class="fas fa-edit"></i> Editar Servicio
            </a>

            <!-- Para cliente propietario: Eliminar (solo si ABIERTO y sin contratista) -->
            <form th:if="${esClientePropietario and servicio.estado.name() == 'ABIERTO' and servicio.contratistaAsignado == null}"
                  th:action="@{/servicios/{id}/eliminar(id=${servicio.id})}"
                  method="post" style="display:inline;">
                <button type="submit" class="btn btn-danger"
                        onclick="return confirm('¿Eliminar este servicio?')">
                    <i class="fas fa-trash"></i> Eliminar
                </button>
            </form>

            <!-- Botón volver -->
            <a class="btn btn-secondary" th:href="@{/servicios}">
                <i class="fas fa-arrow-left"></i> Volver a Servicios
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div th:replace="~{fragments/navbar :: navbarJs}"></div>
</body>
</html>
