<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"
xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detalles del Servicio | Brixo</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/design-system.css}">
<link rel="stylesheet" th:href="@{/css/brixo.css}">
<style>
:root {
--primary: #0ea5e9;
--primary-dark: #0284c7;
--secondary: #6366f1;
--success: #10b981;
--warning: #f59e0b;
--danger: #ef4444;
--bg: #f8fafc;
--card: #ffffff;
--text: #0f172a;
--muted: #64748b;
--border: #e2e8f0;
--sidebar-bg: #0f172a;
}
* { box-sizing: border-box; }
html, body { margin:0; padding:0; font-family:"Plus Jakarta Sans",sans-serif; background:var(--bg); color:var(--text); }

/* Añadido justo antes de .sidebar */
.sidebar-hover-zone {
position: fixed;
left: 0; top: 0; bottom: 0;
width: 25px;
z-index: 99;
background: transparent;
}

.sidebar {
background: linear-gradient(135deg, var(--sidebar-bg) 0%, #1a1f3a 100%);
color: #fff;
padding: 1.8rem 1.2rem;
position: fixed;
left: 0; top: 0; bottom: 0;
width: 260px;
overflow-y: auto;
box-shadow: 8px 0 16px rgba(15, 23, 42, 0.15);
z-index: 100;
transform: translateX(-240px); /* Oculta */
transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Efecto hover */
.sidebar:hover,
.sidebar-hover-zone:hover + .sidebar {
transform: translateX(0);
}

.content {
display: flex; flex-direction: column;
margin-left: 20px;
min-height: 100vh; width: calc(100% - 20px);
transition: margin-left 0.3s ease, width 0.3s ease;
}

.sidebar:hover ~ .content {
margin-left: 260px;
width: calc(100% - 260px);
}

.page-wrap { max-width:960px; margin:0 auto; padding:90px 1.5rem 3rem; }

/* Hero */
.detail-hero { background:linear-gradient(135deg,var(--primary) 0%,var(--secondary) 100%); color:#fff; border-radius:16px; padding:2rem 2.2rem; margin-bottom:1.5rem; box-shadow:0 12px 32px rgba(14,165,233,.2); position:relative; overflow:hidden; }
.detail-hero::after { content:''; position:absolute; top:-30%; right:-10%; width:260px; height:260px; background:rgba(255,255,255,.06); border-radius:50%; }
.detail-hero h1 { font-size:1.7rem; font-weight:800; margin:0 0 .4rem; position:relative; z-index:1; }
.detail-hero .hero-meta { display:flex; gap:1.2rem; flex-wrap:wrap; font-size:.92rem; opacity:.92; position:relative; z-index:1; }
.detail-hero .hero-meta span { display:flex; align-items:center; gap:.3rem; }

/* Badge */
.svc-badge { display:inline-flex; align-items:center; gap:.3rem; padding:.35rem .8rem; border-radius:8px; font-size:.82rem; font-weight:700; text-transform:uppercase; letter-spacing:.3px; }
.svc-badge.abierto { background:rgba(245,158,11,.15); color:#b45309; }
.svc-badge.en_cotizacion { background:rgba(99,102,241,.15); color:#4338ca; }
.svc-badge.en_proceso { background:rgba(14,165,233,.15); color:#0369a1; }
.svc-badge.cerrado { background:rgba(16,185,129,.15); color:#047857; }

/* Cards */
.d-card { background:var(--card); border-radius:14px; border:1px solid var(--border); box-shadow:0 2px 10px rgba(15,23,42,.04); padding:1.5rem; margin-bottom:1.2rem; }
.d-card-title { font-size:.82rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:1rem; display:flex; align-items:center; gap:.4rem; }
.d-card-title i { color:var(--primary); }

.info-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:1.2rem; }
.info-item { }
.info-item .label { font-size:.78rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.3px; margin-bottom:.25rem; }
.info-item .value { font-size:1.05rem; font-weight:600; color:var(--text); }

.desc-text { font-size:.95rem; line-height:1.7; color:var(--text); white-space:pre-wrap; }

.people-grid { display:grid; grid-template-columns:1fr 1fr; gap:1.2rem; }
.person-card { display:flex; align-items:center; gap:.8rem; padding:1rem; border-radius:12px; background:#f8fafc; border:1px solid var(--border); }
.person-card .avatar { width:44px; height:44px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:1.1rem; color:#fff; }
.person-card .avatar.client { background:linear-gradient(135deg,var(--primary),var(--secondary)); }
.person-card .avatar.contractor { background:linear-gradient(135deg,var(--success),#34d399); }
.person-card .avatar.empty { background:#e2e8f0; color:var(--muted); }
.person-card .person-info { flex:1; }
.person-card .person-role { font-size:.75rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.3px; }
.person-card .person-name { font-size:.95rem; font-weight:700; color:var(--text); }

/* Actions */
.actions-bar { display:flex; gap:.6rem; flex-wrap:wrap; }
.btn-bx { border:none; border-radius:10px; padding:.65rem 1.3rem; font-weight:700; cursor:pointer; text-decoration:none; font-size:.9rem; transition:all .25s; display:inline-flex; align-items:center; gap:.4rem; }
.btn-bx:hover { transform:translateY(-2px); box-shadow:0 6px 16px rgba(0,0,0,.12); }
.btn-bx-primary { background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff; }
.btn-bx-primary:hover { color:#fff; }
.btn-bx-success { background:linear-gradient(135deg,var(--success),#059669); color:#fff; }
.btn-bx-success:hover { color:#fff; }
.btn-bx-danger { background:transparent; border:1.5px solid var(--danger); color:var(--danger); }
.btn-bx-danger:hover { background:var(--danger); color:#fff; }
.btn-bx-outline { background:transparent; border:1.5px solid var(--border); color:var(--text); }
.btn-bx-outline:hover { border-color:var(--primary); color:var(--primary); }

.bx-alert-err { border-radius:10px; padding:.7rem 1rem; font-weight:600; font-size:.9rem; margin-bottom:1.2rem; background:rgba(239,68,68,.1); color:#b91c1c; border:1px solid rgba(239,68,68,.2); display:flex; align-items:center; gap:.5rem; }
.bx-alert-ok { border-radius:10px; padding:.7rem 1rem; font-weight:600; font-size:.9rem; margin-bottom:1.2rem; background:rgba(16,185,129,.1); color:#047857; border:1px solid rgba(16,185,129,.2); display:flex; align-items:center; gap:.5rem; }

/* Cotizaciones */
.cot-card { background:#f8fafc; border:1px solid var(--border); border-radius:12px; padding:1rem 1.2rem; display:flex; justify-content:space-between; align-items:center; gap:1rem; transition:all .2s; }
.cot-card:hover { border-color:var(--primary); box-shadow:0 2px 8px rgba(14,165,233,.08); }
.cot-info { flex:1; }
.cot-name { font-weight:700; font-size:.95rem; }
.cot-email { font-size:.8rem; color:var(--muted); }
.cot-msg { font-size:.85rem; color:var(--text); margin-top:.3rem; font-style:italic; }
.cot-date { font-size:.75rem; color:var(--muted); }
.cot-monto { font-size:1.2rem; font-weight:800; color:var(--success); white-space:nowrap; }
.cot-badge { padding:.2rem .5rem; border-radius:6px; font-size:.72rem; font-weight:700; text-transform:uppercase; }
.cot-badge.pendiente { background:rgba(245,158,11,.12); color:#b45309; }
.cot-badge.aceptada { background:rgba(16,185,129,.12); color:#047857; }
.cot-badge.rechazada { background:rgba(239,68,68,.12); color:#b91c1c; }
.cot-actions { display:flex; gap:.3rem; }
.cot-form-card { background:linear-gradient(135deg,rgba(14,165,233,.04),rgba(99,102,241,.04)); border:2px dashed var(--primary); border-radius:12px; padding:1.2rem; }
.cot-form-card label { font-size:.82rem; font-weight:700; color:var(--muted); text-transform:uppercase; }
.cot-form-card input, .cot-form-card textarea { border:1.5px solid var(--border); border-radius:9px; padding:.55rem .8rem; font:inherit; font-size:.9rem; width:100%; }
.cot-form-card input:focus, .cot-form-card textarea:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(14,165,233,.12); }

/* Ajuste de las @media queries al final del <style> (Paso 2) */
@media (max-width: 1024px) {
.sidebar-hover-zone { display: none; }
.sidebar { position: static; width: 100%; padding: 0.8rem; transform: none; box-shadow: none; }
.sidebar:hover { transform: none; }
.content { margin-left: 0; width: 100%; }
.sidebar:hover ~ .content { margin-left: 0; width: 100%; }
}
@media (max-width: 768px) {
.sidebar { display: none; }
}

@media (max-width:640px) {
.info-grid, .people-grid { grid-template-columns:1fr; }
.detail-hero { padding:1.5rem; }
.detail-hero h1 { font-size:1.3rem; }
}
</style></head><body><div th:replace="~{fragments/navbar :: navbar(overlay=false)}"></div><div class="layout">

<div class="sidebar-hover-zone"></div>

<aside class="sidebar">
<div class="sidebar-content">
<h4 class="p-2">Brixo Menú</h4>
</div>
</aside>

<div class="page-wrap content"> <div th:if="${error}" class="bx-alert-err"><i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span></div>
<div th:if="${ok}" class="bx-alert-ok"><i class="fas fa-check-circle"></i> <span th:text="${ok}"></span></div>

<div class="detail-hero">
<h1 th:text="${servicio.titulo}"></h1>
<div class="hero-meta">
<span><i class="fas fa-map-marker-alt"></i> <span th:text="${servicio.ubicacion}"></span></span>
<span><i class="fas fa-calendar"></i> <span th:text="${#temporals.format(servicio.fechaCreacion, 'dd/MM/yyyy HH:mm')}"></span></span>
<span><i class="fas fa-tag"></i> <span th:text="${servicio.tipo != null ? servicio.tipo.displayName : '-'}"></span></span>
</div>
</div>

<div style="display:grid;grid-template-columns:1.3fr 1fr;gap:1.2rem;margin-bottom:1.2rem;">

<div class="d-card" style="margin-bottom:0">
<div class="d-card-title"><i class="fas fa-info-circle"></i> Información del servicio</div>
<div class="info-grid">
<div class="info-item">
<div class="label">Estado</div>
<div><span class="svc-badge" th:classappend="${#strings.toLowerCase(servicio.estado.name())}" th:text="${servicio.estado}"></span></div>
</div>
<div class="info-item">
<div class="label">Tipo</div>
<div class="value" th:text="${servicio.tipo != null ? servicio.tipo.displayName : '-'}"></div>
</div>
<div class="info-item">
<div class="label">Presupuesto</div>
<div class="value" style="color:var(--success);font-size:1.2rem" th:text="'$' + ${#numbers.formatDecimal(servicio.presupuesto, 1, 'POINT', 2, 'COMMA')}"></div>
</div>
<div class="info-item">
<div class="label">Fecha creación</div>
<div class="value" th:text="${#temporals.format(servicio.fechaCreacion, 'dd/MM/yyyy HH:mm')}"></div>
</div>
</div>
</div>

<div class="d-card" style="margin-bottom:0">
<div class="d-card-title"><i class="fas fa-users"></i> Participantes</div>
<div style="display:flex;flex-direction:column;gap:.8rem">
<div class="person-card">
<div class="avatar client"><i class="fas fa-user"></i></div>
<div class="person-info">
<div class="person-role">Cliente</div>
<div class="person-name" th:text="${servicio.cliente != null ? servicio.cliente.nombre : 'No asignado'}"></div>
<div style="font-size:.8rem;color:var(--muted)" th:text="${servicio.cliente != null ? servicio.cliente.email : ''}"></div>
</div>
</div>
<div class="person-card">
<div class="avatar" th:classappend="${servicio.contratistaAsignado != null ? 'contractor' : 'empty'}">
<i class="fas fa-hard-hat"></i>
</div>
<div class="person-info">
<div class="person-role">Contratista</div>
<div class="person-name" th:text="${servicio.contratistaAsignado != null ? servicio.contratistaAsignado.nombre : 'Sin asignar'}"></div>
<div style="font-size:.8rem;color:var(--muted)" th:text="${servicio.contratistaAsignado != null ? servicio.contratistaAsignado.email : 'Pendiente de asignación'}"></div>
</div>
</div>
</div>
</div>
</div>

<div class="d-card">
<div class="d-card-title"><i class="fas fa-align-left"></i> Descripción</div>
<div class="desc-text" th:text="${servicio.descripcion}"></div>
</div>

<div class="d-card">
<div class="d-card-title"><i class="fas fa-file-invoice-dollar"></i> Cotizaciones</div>

<div th:if="${esContratista and servicio.estado.name() == 'ABIERTO' and !yaCotizo}" class="cot-form-card" style="margin-bottom:1rem">
<form th:action="@{/servicios/{id}/cotizar(id=${servicio.id})}" method="post">
<div style="display:grid;grid-template-columns:1fr 2fr;gap:.8rem;align-items:end">
<div>
<label for="monto">Tu precio ($)</label>
<input id="monto" name="monto" type="number" step="0.01" min="1" required placeholder="Ej: 150000">
</div>
<div>
<label for="mensaje">Mensaje (opcional)</label>
<input id="mensaje" name="mensaje" type="text" maxlength="500" placeholder="Describe tu propuesta...">
</div>
</div>
<button type="submit" class="btn-bx btn-bx-success" style="margin-top:.8rem" onclick="return confirm('¿Enviar esta cotización?')">
<i class="fas fa-paper-plane"></i> Enviar cotización
</button>
</form>
</div>

<div th:if="${esContratista and yaCotizo}" style="background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);border-radius:10px;padding:.8rem 1rem;margin-bottom:1rem;font-size:.9rem;font-weight:600;color:#92400e;display:flex;align-items:center;gap:.5rem">
<i class="fas fa-clock"></i> Ya enviaste una cotización pendiente para este servicio
</div>

<div th:if="${!#lists.isEmpty(cotizaciones)}" style="display:flex;flex-direction:column;gap:.6rem">
<div class="cot-card" th:each="c : ${cotizaciones}">
<div class="cot-info">
<div style="display:flex;align-items:center;gap:.5rem;flex-wrap:wrap">
<span class="cot-name" th:text="${c.contratista.nombre}"></span>
<span class="cot-badge" th:classappend="${#strings.toLowerCase(c.estado.name())}" th:text="${c.estado}"></span>
</div>
<div class="cot-email" th:text="${c.contratista.email}"></div>
<div th:if="${c.mensaje != null and !c.mensaje.isBlank()}" class="cot-msg" th:text="${c.mensaje}"></div>
<div class="cot-date" th:text="'Enviada: ' + ${#temporals.format(c.fechaCreacion, 'dd/MM/yyyy HH:mm')}"></div>
</div>
<div style="text-align:right">
<div class="cot-monto" th:text="'$' + ${#numbers.formatDecimal(c.monto, 1, 'POINT', 2, 'COMMA')}"></div>
<div th:if="${esClientePropietario and c.estado.name() == 'PENDIENTE'}" class="cot-actions" style="margin-top:.4rem">
<form th:action="@{/servicios/cotizaciones/{cid}/aceptar(cid=${c.id})}" method="post" style="display:inline">
<input type="hidden" name="servicioId" th:value="${servicio.id}">
<button type="submit" class="btn-bx btn-bx-success btn-bx-sm" onclick="return confirm('¿Aceptar esta cotización?')">
<i class="fas fa-check"></i> Aceptar
</button>
</form>
<form th:action="@{/servicios/cotizaciones/{cid}/rechazar(cid=${c.id})}" method="post" style="display:inline">
<input type="hidden" name="servicioId" th:value="${servicio.id}">
<button type="submit" class="btn-bx btn-bx-danger btn-bx-sm" onclick="return confirm('¿Rechazar esta cotización?')">
<i class="fas fa-times"></i> Rechazar
</button>
</form>
</div>
</div>
</div>
</div>

<div th:if="${#lists.isEmpty(cotizaciones)}" style="text-align:center;padding:1rem;color:var(--muted);font-size:.9rem">
<i class="fas fa-inbox" style="font-size:1.5rem;opacity:.4;display:block;margin-bottom:.4rem"></i>
Aún no hay cotizaciones para este servicio
</div>
</div>

<div class="d-card">
<div class="d-card-title"><i class="fas fa-bolt"></i> Acciones</div>
<div class="actions-bar">
<form th:if="${esContratista and servicio.estado.name() == 'EN_COTIZACION' and esContratistaAsignado}"
th:action="@{/servicios/{id}/iniciar(id=${servicio.id})}" method="post" style="display:inline">
<button type="submit" class="btn-bx btn-bx-success" onclick="return confirm('¿Iniciar el trabajo? Se notificará al cliente.')"><i class="fas fa-play"></i> Iniciar trabajo</button>
</form>
<form th:if="${esContratista and servicio.estado.name() == 'EN_PROCESO' and esContratistaAsignado}"
th:action="@{/servicios/{id}/finalizar(id=${servicio.id})}" method="post" style="display:inline">
<button type="submit" class="btn-bx btn-bx-success"><i class="fas fa-check"></i> Marcar completado</button>
</form>
<a th:if="${esClientePropietario and servicio.estado.name() == 'ABIERTO' and servicio.contratistaAsignado == null}"
class="btn-bx btn-bx-primary" th:href="@{/servicios/{id}/editar(id=${servicio.id})}">
<i class="fas fa-edit"></i> Editar
</a>
<form th:if="${esClientePropietario and servicio.estado.name() == 'ABIERTO' and servicio.contratistaAsignado == null}"
th:action="@{/servicios/{id}/eliminar(id=${servicio.id})}" method="post" style="display:inline">
<button type="submit" class="btn-bx btn-bx-danger" onclick="return confirm('¿Eliminar este servicio?')">
<i class="fas fa-trash"></i> Eliminar
</button>
</form>
<a class="btn-bx btn-bx-outline" th:href="@{/servicios}"><i class="fas fa-arrow-left"></i> Volver a servicios</a>
</div>
</div>

</div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><div th:replace="~{fragments/navbar :: navbarJs}"></div></body></html>
