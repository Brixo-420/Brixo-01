<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Reseñas de ' + ${perfil.nombre} + ' | Brixo'">Reseñas | Brixo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/design-system.css}">
    <link rel="stylesheet" th:href="@{/css/brixo.css}">
    <th:block th:replace="~{fragments/estrellas :: estrellasCss}"></th:block>
    <style>
        :root {
            --primary:#0ea5e9; --primary-dark:#0284c7;
            --secondary:#6366f1;
            --success:#10b981;
            --warning:#f59e0b;
            --danger:#ef4444;
            --bg:#f8fafc; --card:#fff;
            --text:#0f172a; --muted:#64748b; --border:#e2e8f0;
        }
        * { box-sizing:border-box; }
        html, body { margin:0; padding:0; font-family:"Plus Jakarta Sans",sans-serif; background:var(--bg); color:var(--text); }

        .page-wrap { max-width:820px; margin:0 auto; padding:90px 1.5rem 3rem; }

        .rep-hero { background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 60%,#0f172a 100%); color:#fff;
                    border-radius:16px; padding:2rem 2.2rem; margin-bottom:1.2rem; position:relative; overflow:hidden;
                    display:flex; align-items:center; gap:1.4rem; flex-wrap:wrap; }
        .rep-hero::after { content:''; position:absolute; top:-60px; right:-60px; width:220px; height:220px;
                           background:radial-gradient(circle,rgba(14,165,233,.25) 0%,transparent 70%); border-radius:50%; }
        .rep-avatar { width:72px; height:72px; border-radius:50%; background:linear-gradient(135deg,var(--primary),var(--secondary));
                      display:flex; align-items:center; justify-content:center; font-size:1.6rem; font-weight:800; color:#fff;
                      border:3px solid rgba(255,255,255,.2); flex-shrink:0; text-transform:uppercase; position:relative; z-index:1; }
        .rep-info { position:relative; z-index:1; }
        .rep-name { font-size:1.3rem; font-weight:800; margin-bottom:.15rem; }
        .rep-meta { font-size:.85rem; color:#94a3b8; }
        .rep-badge { display:inline-flex; align-items:center; gap:.4rem; background:rgba(255,255,255,.12);
                     border:1px solid rgba(255,255,255,.18); border-radius:20px; padding:.2rem .7rem;
                     font-size:.7rem; font-weight:700; color:#e2e8f0; text-transform:uppercase; letter-spacing:.4px; margin-top:.5rem; }

        .d-card { background:var(--card); border-radius:14px; border:1px solid var(--border);
                  box-shadow:0 2px 10px rgba(15,23,42,.04); padding:1.5rem; margin-bottom:1.2rem; }
        .d-card-title { font-size:.82rem; font-weight:700; color:var(--muted); text-transform:uppercase;
                        letter-spacing:.5px; margin-bottom:1rem; display:flex; align-items:center; gap:.4rem; }
        .d-card-title i { color:var(--warning); }

        .res-card { background:#f8fafc; border:1px solid var(--border); border-radius:12px; padding:1rem 1.2rem; }
        .res-head { display:flex; justify-content:space-between; align-items:flex-start; gap:1rem; flex-wrap:wrap; }
        .res-autor { font-weight:700; font-size:.94rem; }
        .res-flow { font-size:.77rem; color:var(--muted); }
        .res-flow a { color:var(--primary); text-decoration:none; font-weight:600; }
        .res-msg { font-size:.88rem; line-height:1.6; margin-top:.5rem; white-space:pre-wrap; }
        .res-date { font-size:.74rem; color:var(--muted); margin-top:.4rem; }

        .btn-bx { border:none; border-radius:10px; padding:.65rem 1.3rem; font-weight:700; cursor:pointer;
                  text-decoration:none; font-size:.9rem; transition:all .25s; display:inline-flex; align-items:center; gap:.4rem; }
        .btn-bx-outline { background:transparent; border:1.5px solid var(--border); color:var(--text); }
        .btn-bx-outline:hover { border-color:var(--primary); color:var(--primary); }
    </style>
</head>
<body>
<th:block th:replace="~{fragments/bg-icons :: bg-icons}"></th:block>
<div th:replace="~{fragments/navbar :: navbar(overlay=false)}"></div>

<div class="page-wrap" style="position:relative;z-index:1">

    <!-- HERO -->
    <div class="rep-hero">
        <div style="position:absolute;inset:0;pointer-events:none;overflow:hidden;opacity:.07;z-index:0">
            <i class="fas fa-star" style="position:absolute;font-size:8rem;top:-25%;right:10%;color:#fff;transform:rotate(-12deg)"></i>
        </div>
        <div class="rep-avatar" th:text="${#strings.substring(perfil.nombre, 0, 2)}">??</div>
        <div class="rep-info">
            <div class="rep-name" th:text="${perfil.nombre}">Nombre</div>
            <div class="rep-meta">
                <i class="fas fa-city" style="font-size:.75rem"></i> <span th:text="${perfil.ciudad}"></span>
            </div>
            <span class="rep-badge">
                <i class="fas fa-shield-alt" style="font-size:.62rem"></i>
                <span th:text="${perfil.rol != null ? perfil.rol.nombre : 'SIN ROL'}">ROL</span>
            </span>
            <span class="rep-badge" th:if="${perfil.identidadVerificada}" style="background:rgba(16,185,129,.2);border-color:rgba(16,185,129,.35)">
                <i class="fas fa-circle-check" style="font-size:.62rem"></i> Identidad verificada
            </span>
        </div>
    </div>

    <!-- RESUMEN -->
    <div class="d-card">
        <div class="d-card-title"><i class="fas fa-award"></i> Calificación general</div>

        <div th:if="${resumen.sinResenas}" style="text-align:center;padding:1rem;color:var(--muted);font-size:.9rem">
            <i class="fas fa-star" style="font-size:1.6rem;opacity:.35;display:block;margin-bottom:.5rem"></i>
            Este usuario todavía no tiene reseñas.
        </div>

        <div th:unless="${resumen.sinResenas}">
            <div th:replace="~{fragments/estrellas :: resumenResenas(${resumen})}"></div>
        </div>
    </div>

    <!-- RESEÑAS RECIBIDAS -->
    <div class="d-card" th:if="${!#lists.isEmpty(resenas)}">
        <div class="d-card-title"><i class="fas fa-comments"></i> Opiniones recibidas</div>
        <div style="display:flex;flex-direction:column;gap:.6rem">
            <div class="res-card" th:each="r : ${resenas}">
                <div class="res-head">
                    <div>
                        <div class="res-autor" th:text="${r.autor.nombre}"></div>
                        <div class="res-flow">
                            <span th:text="${r.tipo.name() == 'CLIENTE_A_CONTRATISTA'} ? 'Como contratista en' : 'Como cliente en'"></span>
                            <a th:href="@{/servicios/{id}/detalle(id=${r.servicio.id})}" th:text="${r.servicio.titulo}"></a>
                        </div>
                    </div>
                    <span th:replace="~{fragments/estrellas :: estrellas(${r.calificacion}, '.95rem')}"></span>
                </div>
                <div th:if="${r.comentario != null and !r.comentario.isBlank()}" class="res-msg" th:text="${r.comentario}"></div>
                <div class="res-date">
                    <i class="fas fa-clock" style="font-size:.68rem"></i>
                    <span th:text="${#temporals.format(r.fechaCreacion, 'dd/MM/yyyy HH:mm')}"></span>
                    <span th:if="${r.fechaEdicion != null}"> · editada</span>
                </div>
            </div>
        </div>
    </div>

    <a class="btn-bx btn-bx-outline" th:href="@{/servicios}"><i class="fas fa-arrow-left"></i> Volver a servicios</a>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div th:replace="~{fragments/navbar :: navbarJs}"></div>
</body>
</html>
