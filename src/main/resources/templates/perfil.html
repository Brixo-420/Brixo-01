<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi Perfil | Brixo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/design-system.css}">
    <link rel="stylesheet" th:href="@{/css/brixo.css}">
    <style>
        :root {
            --primary: #0ea5e9;
            --primary-dark: #0284c7;
            --secondary: #6366f1;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; }
        html, body { margin:0; padding:0; font-family:"Plus Jakarta Sans",sans-serif; background:var(--bg); color:var(--text); }

        .page-wrap { max-width:680px; margin:0 auto; padding:90px 1.5rem 3rem; }

        .profile-card { background:var(--card); border-radius:16px; border:1px solid var(--border); box-shadow:0 4px 16px rgba(15,23,42,.06); overflow:hidden; }
        .profile-header { background:linear-gradient(135deg,var(--primary) 0%,var(--secondary) 100%); padding:2rem; color:#fff; text-align:center; position:relative; overflow:hidden; }
        .profile-header::after { content:''; position:absolute; top:-50%; right:-15%; width:250px; height:250px; background:rgba(255,255,255,.06); border-radius:50%; }
        .profile-avatar { width:80px; height:80px; border-radius:50%; background:rgba(255,255,255,.2); display:flex; align-items:center; justify-content:center; margin:0 auto .8rem; font-size:2rem; border:3px solid rgba(255,255,255,.3); position:relative; z-index:1; }
        .profile-header h1 { font-size:1.3rem; font-weight:800; margin:0; position:relative; z-index:1; }
        .profile-header p { margin:.2rem 0 0; font-size:.88rem; opacity:.85; position:relative; z-index:1; }
        .profile-role { display:inline-block; margin-top:.5rem; padding:.25rem .7rem; border-radius:20px; background:rgba(255,255,255,.2); font-size:.78rem; font-weight:700; text-transform:uppercase; letter-spacing:.3px; position:relative; z-index:1; }

        .profile-body { padding:2rem; }

        .field { margin-bottom:1.2rem; }
        .field label { font-size:.82rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; margin-bottom:.4rem; display:flex; align-items:center; gap:.3rem; }
        .field label i { color:var(--primary); font-size:.78rem; }
        .field label .req { color:var(--danger); }
        .field input { border:1.5px solid var(--border); border-radius:10px; padding:.65rem .9rem; font:inherit; font-size:.92rem; width:100%; transition:all .2s; background:#fff; }
        .field input:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(14,165,233,.12); }
        .field input.is-invalid { border-color:var(--danger); }
        .field input.is-valid { border-color:var(--success); }
        .field .hint { font-size:.78rem; color:var(--muted); margin-top:.3rem; }
        .field .err { font-size:.78rem; color:var(--danger); margin-top:.3rem; display:none; }
        .field .err.show { display:block; }

        .pw-strength { height:4px; border-radius:4px; margin-top:.4rem; transition:background-color .3s; background:#e2e8f0; }
        .pw-strength.weak { background:var(--danger); }
        .pw-strength.fair { background:var(--warning); }
        .pw-strength.good { background:var(--success); }

        .field-grid { display:grid; grid-template-columns:1fr 1fr; gap:1.2rem; }

        .form-actions { display:flex; gap:.6rem; margin-top:1.5rem; padding-top:1.2rem; border-top:1px solid var(--border); }
        .btn-bx { border:none; border-radius:10px; padding:.65rem 1.3rem; font-weight:700; cursor:pointer; text-decoration:none; font-size:.9rem; transition:all .25s; display:inline-flex; align-items:center; gap:.4rem; }
        .btn-bx:hover { transform:translateY(-2px); box-shadow:0 6px 16px rgba(0,0,0,.12); }
        .btn-bx-primary { background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff; }
        .btn-bx-primary:hover { color:#fff; }
        .btn-bx-outline { background:transparent; border:1.5px solid var(--border); color:var(--text); }
        .btn-bx-outline:hover { border-color:var(--primary); color:var(--primary); }

        .bx-alert { border-radius:10px; padding:.7rem 1rem; font-weight:600; font-size:.9rem; margin-bottom:1.2rem; display:flex; align-items:center; gap:.5rem; }
        .bx-alert-ok { background:rgba(16,185,129,.1); color:#047857; border:1px solid rgba(16,185,129,.2); }
        .bx-alert-err { background:rgba(239,68,68,.1); color:#b91c1c; border:1px solid rgba(239,68,68,.2); }

        @media (max-width:640px) {
            .field-grid { grid-template-columns:1fr; }
            .profile-body { padding:1.2rem; }
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar(overlay=false)}"></div>

<div class="page-wrap">

    <div th:if="${ok}" class="bx-alert bx-alert-ok"><i class="fas fa-check-circle"></i> <span th:text="${ok}"></span></div>
    <div th:if="${error}" class="bx-alert bx-alert-err"><i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span></div>

    <div class="profile-card">
        <div class="profile-header">
            <div class="profile-avatar"><i class="fas fa-user"></i></div>
            <h1 th:text="${usuario.nombre}">Nombre</h1>
            <p th:text="${usuario.email}">email@ejemplo.com</p>
            <div class="profile-role" th:text="${usuario.rol != null ? usuario.rol.nombre : 'SIN ROL'}">ROL</div>
        </div>
        <div class="profile-body">
            <form id="perfilForm" th:action="@{/perfil}" method="post" novalidate>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="field-grid">
                    <div class="field">
                        <label for="nombre"><i class="fas fa-user"></i> Nombre <span class="req">*</span></label>
                        <input id="nombre" name="nombre" type="text" th:value="${usuario.nombre}" required minlength="3" maxlength="100" placeholder="Tu nombre">
                        <div class="err" id="nombreError">El nombre debe tener entre 3 y 100 caracteres</div>
                    </div>

                    <div class="field">
                        <label for="email"><i class="fas fa-envelope"></i> Correo <span class="req">*</span></label>
                        <input id="email" name="email" type="email" th:value="${usuario.email}" required maxlength="120" placeholder="correo@ejemplo.com">
                        <div class="err" id="emailError">Ingresa un correo electrónico válido</div>
                    </div>

                    <div class="field">
                        <label for="telefono"><i class="fas fa-phone"></i> Teléfono</label>
                        <input id="telefono" name="telefono" type="tel" th:value="${usuario.telefono}" maxlength="20" placeholder="+52 55 1234 5678">
                        <div class="hint">Opcional</div>
                        <div class="err" id="telefonoError">Formato de teléfono inválido</div>
                    </div>

                    <div class="field">
                        <label for="password"><i class="fas fa-lock"></i> Nueva contraseña</label>
                        <input id="password" name="password" type="password" minlength="6" maxlength="120" placeholder="Dejar vacío para no cambiar">
                        <div class="pw-strength" id="pwStrength"></div>
                        <div class="hint">Déjalo vacío si no quieres cambiarla</div>
                        <div class="err" id="passwordError">La contraseña debe tener mínimo 6 caracteres</div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-bx btn-bx-primary">
                        <i class="fas fa-save"></i> Guardar cambios
                    </button>
                    <a th:href="@{/dashboard}" class="btn-bx btn-bx-outline">
                        <i class="fas fa-arrow-left"></i> Volver al panel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div th:replace="~{fragments/navbar :: navbarJs}"></div>
<script>
(function() {
    const form = document.getElementById('perfilForm');
    if (!form) return;

    const rules = {
        nombre:   { test: v => v.length >= 3 && v.length <= 100, msgId: 'nombreError' },
        email:    { test: v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v), msgId: 'emailError' },
        telefono: { test: v => v === '' || /^[+]?[0-9\s\-()]{7,20}$/.test(v), msgId: 'telefonoError', optional: true },
        password: { test: v => v === '' || v.length >= 6, msgId: 'passwordError', optional: true }
    };

    function check(field) {
        const r = rules[field.id];
        if (!r) return true;
        const v = field.id === 'password' ? field.value : field.value.trim();
        if (r.optional && v === '') {
            field.classList.remove('is-invalid', 'is-valid');
            document.getElementById(r.msgId).classList.remove('show');
            return true;
        }
        const ok = r.test(v);
        field.classList.toggle('is-invalid', !ok && v.length > 0);
        field.classList.toggle('is-valid', ok && v.length > 0);
        document.getElementById(r.msgId).classList.toggle('show', !ok && v.length > 0);
        return ok || v.length === 0;
    }

    Object.keys(rules).forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('blur', () => check(el));
        el.addEventListener('input', () => check(el));
    });

    // Password strength
    const pw = document.getElementById('password');
    if (pw) pw.addEventListener('input', function() {
        const v = pw.value, bar = document.getElementById('pwStrength');
        bar.classList.remove('weak','fair','good');
        if (!v) return;
        let s = 0;
        if (v.length >= 6) s++;
        if (v.length >= 8) s++;
        if (/[a-z]/.test(v) && /[A-Z]/.test(v)) s++;
        if (/[0-9]/.test(v)) s++;
        if (/[^a-zA-Z0-9]/.test(v)) s++;
        bar.classList.add(s <= 2 ? 'weak' : s <= 3 ? 'fair' : 'good');
    });

    form.addEventListener('submit', function(e) {
        let valid = true;
        Object.keys(rules).forEach(id => {
            const el = document.getElementById(id);
            if (!el) return;
            const v = el.id === 'password' ? el.value : el.value.trim();
            if (!rules[id].optional && v === '') {
                valid = false;
                el.classList.add('is-invalid');
                document.getElementById(rules[id].msgId).classList.add('show');
            } else if (!check(el) && (!rules[id].optional || v !== '')) {
                valid = false;
            }
        });
        if (!valid) e.preventDefault();
    });
})();
</script>
</body>
</html>
